<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Larkin</title>
<meta name="theme-color" content="#FFFFFF" id="theme-color">
<meta name="color-scheme" content="light dark">
<script>
// Set the theme before anything is drawn: the saved choice, else the device's.
(function () {
  var t = null;
  try { t = localStorage.getItem('larkin-dash-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larkin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Larkin's private dashboard, laid out like a payments dashboard: hairlines,
   small type, underline tabs, soft button shadows, short transitions. The
   accent is Larkin's lime, always as a fill with dark text on it. Two themes:
   light and dark, set on <html data-theme>. */
@font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/fonts/dm-sans-latin.woff2") format("woff2"); }
:root {
  --bg: #FFFFFF;
  --panel: #FFFFFF;
  --btn: #FFFFFF;
  --title: #1A1B25;
  --text: #353A44;
  --sub: #687385;
  --icon: #6C7688;
  --line: #EBEEF1;
  --ctl: #D8DEE4;
  --ctl-hover: #C0C8D2;
  --subtle: #F6F8FA;
  --hover: #F5F6F8;
  --lime: #D2ED28;
  --on-lime: #151515;
  --lime-edge: rgba(21, 21, 21, .14);
  /* Lime as text: pure lime can't be read on white, so the light theme uses a deeper shade of it. */
  --accent-text: #5F7A00;
  --up: #1F9D55;
  --down: #DF1B41;
  --shadow-btn: 0 1px 1px rgba(0, 0, 0, .08);
  --shadow-btn-hover: 0 2px 5px rgba(64, 68, 82, .12);
  --shadow-pop: 0 0 0 1px rgba(136, 152, 170, .1), 0 15px 35px rgba(49, 49, 93, .1), 0 5px 15px rgba(0, 0, 0, .08);
  --shadow-lift: 0 7px 14px rgba(48, 49, 61, .08), 0 3px 6px rgba(0, 0, 0, .08);
  --backdrop: rgba(48, 49, 61, .5);
  --sk1: #EBEEF1;
  --sk2: #F6F8FA;
  --b-bg: #EBEEF1; --b-fg: #545969;
  --b-info-bg: #CFF5F6; --b-info-fg: #0055BC;
  --b-warn-bg: #FCEDB9; --b-warn-fg: #A82C00;
  /* Graph: revenue is lime, ad spend grey, profit green and loss red. */
  --c-main: #D2ED28;
  --c-alt: #A3ACBA;
  --c-bar-edge: rgba(21, 21, 21, .16);
  --area-top: .6;
  --grid: #EBEEF1;
  --zero: #C0C8D2;
  --side: 250px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0E0E10;
  --panel: #151517;
  --btn: #1C1C20;
  --title: #F4F4F5;
  --text: #D0D0D6;
  --sub: #9494A0;
  --icon: #8A8A96;
  --line: #232327;
  --ctl: #34343B;
  --ctl-hover: #4C4C56;
  --subtle: #17171A;
  --hover: #1B1B1F;
  --lime-edge: transparent;
  --accent-text: #D2ED28;
  --up: #3CCB7F;
  --down: #F2555A;
  --shadow-btn: 0 1px 1px rgba(0, 0, 0, .4);
  --shadow-btn-hover: 0 2px 6px rgba(0, 0, 0, .5);
  --shadow-pop: 0 0 0 1px #2C2C33, 0 15px 35px rgba(0, 0, 0, .55);
  --shadow-lift: 0 0 0 1px #34343B, 0 8px 18px rgba(0, 0, 0, .5);
  --backdrop: rgba(0, 0, 0, .62);
  --sk1: #1B1B1F;
  --sk2: #27272C;
  --b-bg: #27272C; --b-fg: #C4C4CE;
  --b-info-bg: #0D3440; --b-info-fg: #8EDDF0;
  --b-warn-bg: #43330A; --b-warn-fg: #F3D27C;
  --c-main: #D2ED28;
  --c-alt: #7A7A86;
  --c-bar-edge: transparent;
  --area-top: .26;
  --grid: #232327;
  --zero: #3C3C44;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 20px; font-weight: 400;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  transition: background-color .2s, color .2s;
}
h1 { font-size: 28px; line-height: 36px; letter-spacing: -0.01em; font-weight: 700; color: var(--title); margin: 0; }
h2 { font-size: 20px; line-height: 28px; letter-spacing: -0.005em; font-weight: 700; color: var(--title); margin: 0; }
h3 { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--title); margin: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
.sub { color: var(--sub); }
.small { font-size: 12px; line-height: 16px; }
.hide { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus { outline: none; }
:focus-visible { box-shadow: 0 0 0 1px var(--title), 0 0 0 4px rgba(210, 237, 40, .7) !important; border-radius: 6px; }

/* Sidebar */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); padding: 24px 16px 16px; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 28px; transition: background-color .2s, border-color .2s; }
.acct { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px; font-weight: 600; color: var(--title); }
.mark { width: 24px; height: 24px; border-radius: 6px; background: var(--lime); display: grid; place-items: center; flex: none; }
.mark svg { width: 24px; height: 24px; fill: #151515; display: block; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 13px; height: 30px; padding: 0 8px; border-radius: 6px; text-align: left; color: var(--text); font-weight: 500; transition: background-color .15s, color .15s; }
.nav svg, .tabbar svg { width: 16px; height: 16px; flex: none; color: var(--icon); transition: color .15s; }
.nav button:hover { background: var(--hover); }
.nav button:active { background: var(--line); }
.nav button[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.nav button[aria-current="page"] svg { color: var(--accent-text); }
.side .nav.end { margin-top: auto; }

.main { margin-left: var(--side); padding: 28px 40px 96px; }
.inner { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.stack { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.tabbar, .phone-acct { display: none; }
.phone-only { display: none !important; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.headside { display: flex; align-items: center; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px;
  background: var(--btn); color: var(--title); font-weight: 600; white-space: nowrap; text-decoration: none;
  box-shadow: 0 0 0 1px var(--ctl), var(--shadow-btn);
  transition: box-shadow .15s, background-color .15s, color .15s, filter .15s;
}
.btn:hover { box-shadow: 0 0 0 1px var(--ctl-hover), var(--shadow-btn-hover); }
.btn:active { background: var(--subtle); box-shadow: 0 0 0 1px var(--ctl-hover); }
.btn svg { width: 12px; height: 12px; color: var(--icon); }
.btn.icon { width: 28px; padding: 0; }
.btn.icon svg { width: 14px; height: 14px; }
.btn.primary { background: var(--lime); color: var(--on-lime); box-shadow: 0 0 0 1px var(--lime-edge), var(--shadow-btn); }
.btn.primary:hover { filter: brightness(.95); box-shadow: 0 0 0 1px var(--lime-edge), var(--shadow-btn-hover); }
.btn[disabled] { color: var(--sub); cursor: default; box-shadow: 0 0 0 1px var(--line); }
.btn.spin svg { animation: turn .8s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.link { color: var(--accent-text); font-weight: 600; text-decoration: none; transition: color .15s; }
.link:hover { color: var(--title); }

/* Date-range tabs with a lime underline, sitting on the page's hairline */
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-top: -8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { height: 38px; font-weight: 600; color: var(--sub); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; flex: none; transition: color .15s, border-color .15s; border-radius: 0; }
.tabs button:hover { color: var(--title); border-bottom-color: var(--ctl); }
.tabs button[aria-pressed="true"] { color: var(--accent-text); border-bottom-color: var(--lime); }

.note { background: var(--subtle); border-radius: 8px; padding: 12px 16px; color: var(--text); }
.note p + p { margin-top: 4px; }

/* Content arrives with a short rise */
.enter > * { animation: rise .32s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .04s; }
.enter > *:nth-child(3) { animation-delay: .08s; }
.enter > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.metrics { display: grid; gap: 32px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric .n { display: block; font-size: 24px; line-height: 32px; color: var(--title); margin: 2px 0; white-space: nowrap; }

.sec { display: flex; flex-direction: column; gap: 16px; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: 12px; line-height: 16px; }
.legend span, .tip div span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px var(--c-bar-edge); }

.cards { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; background: var(--panel); transition: background-color .2s, border-color .2s; }
.card .l { font-weight: 600; color: var(--title); }
.card .n { display: block; font-size: 20px; line-height: 28px; color: var(--title); margin: 8px 0 2px; white-space: nowrap; }

/* Graph */
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; font-size: 12px; fill: var(--sub); }
.chart .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; }
.chart .grow { animation: fade .6s ease both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.tip {
  position: absolute; top: 0; left: 0; pointer-events: none; background: var(--panel); border-radius: 8px; padding: 10px 12px; min-width: 164px; white-space: nowrap;
  box-shadow: var(--shadow-pop); font-size: 12px; line-height: 16px; opacity: 0; transition: opacity .12s, transform .08s ease-out;
}
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 500; color: var(--sub); margin-bottom: 6px; }
.tip div { display: flex; justify-content: space-between; gap: 20px; padding: 2px 0; color: var(--text); }
.tip div span:last-child { color: var(--title); font-weight: 600; }

/* Ads */
.ads { display: grid; gap: 16px; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; }
.ad { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); transition: box-shadow .2s, transform .2s var(--ease), background-color .2s, border-color .2s; }
.ad:hover { box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.ad .pic { display: block; position: relative; aspect-ratio: 9 / 16; background: var(--subtle); }
.ad .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad .tag { position: absolute; left: 8px; top: 8px; background: #FFFFFF; color: #1A1B25; }
.ad .txt { padding: 12px 14px 14px; }
.ad .name { font-weight: 600; color: var(--title); margin-bottom: 6px; text-wrap: balance; }
.ad .txt p { color: var(--sub); }
.ad .txt .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.ad .txt .row span:last-child { color: var(--title); font-weight: 500; }

/* Costs: one list per section, rows split by hairlines */
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ledger li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ledger .name { font-weight: 600; color: var(--title); }
.ledger .price { text-align: right; color: var(--title); font-weight: 500; white-space: nowrap; }
.ledger .price .sub { display: block; font-weight: 400; }
.ledger .unknown { color: var(--sub); font-weight: 400; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 16px; font-weight: 500; background: var(--b-bg); color: var(--b-fg); white-space: nowrap; }
.badge.ok { background: var(--lime); color: var(--on-lime); font-weight: 600; }
.badge.info { background: var(--b-info-bg); color: var(--b-info-fg); }
.badge.warn { background: var(--b-warn-bg); color: var(--b-warn-fg); }

/* Posts */
.ig { max-width: 420px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-radius: 8px; overflow: hidden; }
.ig button, .ig div { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--subtle); display: block; border-radius: 0; }
.ig img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s var(--ease), opacity .2s; }
.ig button:hover img { transform: scale(1.03); }
.ig .pending img { opacity: .45; }
.ig .d { position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: #1A1B25; border-radius: 4px; font-size: 11px; line-height: 16px; font-weight: 600; padding: 1px 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
.toggle input { width: 14px; height: 14px; accent-color: var(--lime); margin: 0; }
.post { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 20px; align-items: start; scroll-margin-top: 16px; background: var(--panel); transition: background-color .2s, border-color .2s; }
.post > .pic { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--subtle); cursor: zoom-in; }
.post > .pic img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; transition: transform .3s var(--ease); }
.post > .pic:hover img { transform: scale(1.03); }
.post > .pic.reel { cursor: pointer; }
.post > .pic .play { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center; box-shadow: var(--shadow-lift); }
.post > .pic .play svg { width: 16px; height: 16px; margin-left: 2px; fill: #1A1B25; }
dialog.view { width: fit-content; max-width: calc(100vw - 24px); }
.view .stage { background: #000000; display: flex; justify-content: center; }
.view .stage video, .view .stage img { display: block; height: min(calc(100vh - 88px), 860px); width: auto; max-width: calc(100vw - 24px); object-fit: contain; }
.view .stage video { aspect-ratio: 9 / 16; }
.pbody { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.prow .name { font-weight: 600; color: var(--title); }
.prow .state { display: inline-flex; align-items: center; gap: 8px; }
label.f { display: block; font-weight: 500; color: var(--title); }
label.f > textarea, label.f > input { margin-top: 4px; font-weight: 400; }
div.f { display: block; }
div.f > textarea { margin-top: 4px; }
.flabel { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 500; color: var(--title); }
.flabel .btn { font-weight: 700; }
textarea, input[type="text"], input[type="datetime-local"], input[type="password"] {
  width: 100%; background: var(--btn); border: 0; border-radius: 6px; padding: 6px 10px; color: var(--title); font-size: 14px; line-height: 20px;
  box-shadow: 0 0 0 1px var(--ctl), var(--shadow-btn); transition: box-shadow .15s, background-color .2s;
}
textarea:hover, input:hover { box-shadow: 0 0 0 1px var(--ctl-hover), var(--shadow-btn); }
textarea { min-height: 76px; resize: vertical; display: block; }
input[type="datetime-local"] { max-width: 230px; display: block; }
textarea:disabled, input:disabled { background: var(--subtle); color: var(--sub); box-shadow: 0 0 0 1px var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Emails: each flow as a timeline */
.draft { border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 16px; background: var(--panel); transition: background-color .2s, border-color .2s; }
.draft .meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 12px; }
.draft .meta dt { color: var(--sub); }
.draft .meta dd { margin: 0; color: var(--text); }
.draft input[type=text] { width: 100%; }
.draft textarea.mailtext { min-height: 260px; field-sizing: content; max-height: 70vh; }
/* Drafts are edited inside the email itself, as people will see it. */
.draft .mail { border-radius: 8px; box-shadow: 0 0 0 1px var(--line); margin-top: 4px; }
.mail .inl { display: block; width: 100%; min-width: 0; background: transparent; border: 0; box-shadow: none; padding: 2px 6px; margin: -2px -6px; border-radius: 4px; font: inherit; color: inherit; line-height: inherit; transition: box-shadow .15s; }
.mail .inl:not(:disabled):hover, .mail .editable[contenteditable="true"]:hover { box-shadow: 0 0 0 1px #D0D5DB; }
.mail .inl:disabled { background: transparent; color: inherit; box-shadow: none; }
.inbox .line.edit { display: flex; align-items: baseline; gap: 4px; }
.inbox .line.edit .inl { flex: 1; color: #5F6368; }
.letter .subject.inl { width: calc(100% + 12px); }
.letter .body.editable { padding: 4px 6px; margin-left: 46px; min-height: 200px; border-radius: 4px; cursor: text; transition: box-shadow .15s; }
.letter .body.editable b, .letter .body.editable strong { font-weight: 700; }
.letter .body.editable[contenteditable="false"] { cursor: default; }
@media (max-width: 640px) { .letter .body.editable { margin-left: -6px; } }
/* Phone view: the email at an iPhone's width, laid out as phone mail apps show it. */
.flabel .tools { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--subtle); }
.seg .btn { box-shadow: none; background: transparent; font-weight: 500; color: var(--sub); }
.seg .btn[aria-pressed="true"] { background: var(--btn); color: var(--title); box-shadow: var(--shadow-btn); }
.draft .mail.phone { max-width: 390px; margin-left: auto; margin-right: auto; }
.mail.phone .inbox { grid-template-columns: minmax(0, 1fr) auto; padding: 11px 16px; }
.mail.phone .inbox .line { grid-column: 1 / -1; grid-row: 2; }
.mail.phone .letter { padding: 18px 16px 24px; }
.mail.phone .letter .body, .mail.phone .letter .footer { padding-left: 0; }
.mail.phone .letter .body.editable { margin-left: -6px; }
.draft .check { border-left: 2px solid var(--ctl-hover); padding-left: 10px; }

/* Email board: one column per status; In Loops follows the workflow order. */
.board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
.col { background: var(--subtle); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; scroll-snap-align: start; transition: background-color .2s; }
.col > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 4px; }
.col > header b { font-weight: 600; color: var(--title); }
.col > header span { color: var(--sub); }
.col .empty { color: var(--sub); padding: 4px; }
.col .lane { color: var(--title); font-weight: 600; padding: 8px 4px 0; }
.col .wait { color: var(--sub); padding: 2px 4px 0 14px; position: relative; }
.col .wait::before { content: ""; position: absolute; left: 5px; top: 2px; bottom: -6px; width: 1px; background: var(--ctl-hover); }
.ecard { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; transition: border-color .15s, box-shadow .15s, background-color .2s; }
.ecard:hover { border-color: var(--ctl-hover); box-shadow: var(--shadow-btn); }
.ecard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--sub); }
.ecard .t { font-weight: 600; color: var(--title); }
.ecard .s { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.steps li:last-child { padding-bottom: 12px; }
.steps li:last-child::after { display: none; }
.steps li > p:first-child { color: var(--title); font-weight: 500; }
.steps .btn { margin-top: 8px; }
.flow .foot { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* Pop-up. The email itself stays white and in Arial, the way a mail app shows it. */
dialog { border: 0; padding: 0; background: transparent; width: min(700px, calc(100vw - 24px)); max-height: calc(100vh - 24px); color: var(--text); overflow: visible; }
dialog::backdrop { background: var(--backdrop); animation: fade .2s ease both; }

.inbox .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #5F6368; }

.from .av { width: 40px; height: 40px; border-radius: 50%; background: #151515; color: #FFFFFF; display: grid; place-items: center; font-size: 17px; }
.from .who { font-size: 14px; line-height: 20px; overflow-wrap: anywhere; color: #1F1F1F; }

/* Loading placeholders */
.sk { border-radius: 6px; background: linear-gradient(90deg, var(--sk1) 25%, var(--sk2) 37%, var(--sk1) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
@keyframes sk { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

/* Lock */
.lock { max-width: 340px; margin: 0 auto; padding: 18vh 16px 0; }
.lock .acct { padding: 0; margin-bottom: 20px; font-size: 16px; }
.lock form { display: flex; gap: 8px; margin-top: 16px; }
.lock input { flex: 1; min-width: 0; height: 36px; }
.lock .btn { height: 36px; padding: 0 16px; }
.msg { min-height: 20px; margin-top: 10px; }

@media (max-width: 1320px) { .ads { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

}

  .inner { gap: 20px; }
  .stack { gap: 28px; }

  .tabbar {

  .tabbar svg { width: 20px; height: 20px; }

  .btn { height: 32px; }
  .btn.icon { width: 32px; }
  .tabs { gap: 20px; margin-left: -16px; margin-right: -16px; padding: 0 16px; }

}

<body>

<section class="lock hide" id="lock">

  <p class="sub">Enter the passcode to open the dashboard.</p>
  <form id="lock-form">
    <input id="code" type="password" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode">
    <button class="btn primary" type="submit">Continue</button>
  </form>
  <p class="msg sub" id="lock-msg" role="status"></p>
</section>

<div id="shell" class="hide">

    <div class="acct"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#monogram"/></svg></span>Larkin</div>

    <div class="nav end"><button type="button" data-theme-switch></button></div>
  </aside>
  <main class="main">
    <div class="inner">
      <div class="acct phone-acct"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#monogram"/></svg></span>Larkin</div>
      <div class="head">
        <h1 id="title">Ads</h1>
        <div class="headside">
          <span class="sub small" id="updated"></span>
          <button class="btn icon phone-only" type="button" data-theme-switch aria-label="Switch theme"></button>
          <button class="btn" id="refresh" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13.6 1.8v3.4h-3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Refresh</span></button>
        </div>
      </div>
      <div class="tabs" id="switch" role="group" aria-label="Date range"></div>
      <div class="note hide" id="alerts"></div>
      <div class="stack" id="view"></div>
    </div>
  </main>
  <nav class="tabbar" id="tabs" aria-label="Sections"></nav>
</div>

<dialog id="mail" aria-label="Email preview"></dialog>
<dialog id="draft-dlg" class="wide" aria-label="Email"></dialog>
<dialog id="viewer" class="view" aria-label="Post"></dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Larkin's "l." monogram -->
  <symbol id="monogram" viewBox="0 0 24 24"><rect x="8.2" y="5" width="3.2" height="14"/><circle cx="15.4" cy="17.1" r="1.9"/></symbol>
</svg>

<script>
(function () {

  var F = 'fill="currentColor"';
  var PAGES = [
    { id: 'ads', name: 'Ads', part: 'ads', periods: true, icon: '<path ' + F + ' d="M12.6 2.1a.9.9 0 0 0-1.4-.8L6.4 4.4H3.6A1.6 1.6 0 0 0 2 6v2.9a1.6 1.6 0 0 0 1.6 1.6h.2l.6 3a1.1 1.1 0 0 0 1 .9h.9a1.1 1.1 0 0 0 1-1.3l-.5-2.4 4.4 2.8a.9.9 0 0 0 1.4-.8V2.1z"/><path ' + F + ' d="M13.9 5.6a.65.65 0 0 1 .9.2 3.2 3.2 0 0 1 0 3.3.65.65 0 1 1-1.1-.7 1.9 1.9 0 0 0 0-1.9.65.65 0 0 1 .2-.9z"/>' },
    { id: 'posts', name: 'Posts', part: 'posts', icon: '<path ' + F + ' fill-rule="evenodd" d="M3.6 2A1.6 1.6 0 0 0 2 3.6v8.8A1.6 1.6 0 0 0 3.6 14h8.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 12.4 2H3.6zm2 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-2.1 5.4 2.6-3 1.8 1.6 2.5-3.2 2.1 3v1.6h-9z"/>' },
    { id: 'website', name: 'Website', part: 'site', periods: true, icon: '<path ' + F + ' fill-rule="evenodd" d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM3 7.4a5 5 0 0 1 2.900-3.800A9.300 9.300 0 0 0 5.200 7.400H3zm0 1.200h2.200a9.300 9.300 0 0 0 .700 3.800A5 5 0 0 1 3 8.600zm3.400 0h3.200c-.1 1.800-.7 3.300-1.600 4.300-.9-1-1.500-2.500-1.600-4.300zm3.200-1.200H6.400C6.500 5.600 7.100 4.100 8 3.100c.9 1 1.500 2.500 1.600 4.300zm1.200 1.200H13a5 5 0 0 1-2.900 3.800 9.300 9.300 0 0 0 .7-3.800zm2.200-1.200h-2.200a9.300 9.300 0 0 0-.7-3.800A5 5 0 0 1 13 7.400z"/>' },
    { id: 'app', name: 'App', part: 'site', periods: true, icon: '<path ' + F + ' fill-rule="evenodd" d="M5.600 1A1.600 1.600 0 0 0 4 2.600v10.800A1.600 1.600 0 0 0 5.600 15h4.800a1.600 1.600 0 0 0 1.600-1.600V2.600A1.600 1.600 0 0 0 10.400 1H5.600zM7 11.900a.65.65 0 1 0 0 1.300h2a.65.65 0 1 0 0-1.300H7z"/>' },

    { id: 'costs', name: 'Costs', part: 'costs', icon: '<path ' + F + ' fill-rule="evenodd" d="M3.600 1.500A1.600 1.600 0 0 0 2 3.100v10.600a.8.8 0 0 0 1.200.7l1.300-.8 1.300.8a.8.8 0 0 0 .8 0L8 13.600l1.400.8a.8.8 0 0 0 .8 0l1.300-.8 1.300.8a.8.8 0 0 0 1.200-.7V3.100a1.600 1.600 0 0 0-1.600-1.600H3.600zM5 5.100a.65.65 0 0 0 0 1.300h6a.65.65 0 1 0 0-1.300H5zm0 2.800a.65.65 0 0 0 0 1.300h6a.65.65 0 1 0 0-1.300H5z"/>' }
  ];
  var PERIODS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', 'Last 7 days'], ['14d', 'Last 14 days'], ['30d', 'Last 30 days']];
  var MAIN = 'var(--c-main)', ALT = 'var(--c-alt)', UP = 'var(--up)', DOWN = 'var(--down)';
  var cache = {};      // part → latest answer
  var loading = {};    // part → true while a request is out
  var failed = {};     // part → true when the last request failed
  var page = 'ads';
  var redraw = null;   // redraws the graph on the current page at the new width
  var period = read('larkin-dash-period') || 'today';
  if (!PERIODS.some(function (p) { return p[0] === period; })) period = 'today';

  function $(id) { return document.getElementById(id); }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(n) {
    if (n == null) return '–';
    var text = '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return n < 0 ? '−' + text : text;
  }
  function times(n) { return n == null ? null : n.toFixed(2) + '×'; }
  function num(n) { return n == null ? '–' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  function plural(n, one, many) { return num(n) + ' ' + (n === 1 ? one : many); }
  function dayOf(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function niceDate(iso) { return dayOf(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function longDate(iso) { return dayOf(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function current() { return PAGES.filter(function (p) { return p.id === page; })[0]; }
  function pick(list) { return (list || []).filter(function (p) { return p.key === period; })[0] || null; }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (Array.isArray(kid)) kid.forEach(function (c) { if (c) n.appendChild(c); });
      else if (kid) n.appendChild(kid);
    }
    return n;
  }

  /* ---------- loading ---------- */

  function showLock(message) {
    $('shell').classList.add('hide');
    $('lock').classList.remove('hide');
    $('lock-msg').textContent = message || '';
    $('code').focus();
  }

  function load(part, force) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    if (loading[part]) return;
    var have = cache[part];
    if (have && !force && Date.now() - new Date(have.updatedAt).getTime() < 60000) return;
    loading[part] = true;
    if (current().part === part && !have) render(); else frame();
    fetch(API + '?part=' + part, { headers: { 'x-dashboard-key': code }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { write(KEY, null); showLock('That passcode didn’t work.'); throw null; }
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (json) {
        var first = !cache[part];
        cache[part] = json;
        failed[part] = false;
        $('lock').classList.add('hide');
        $('shell').classList.remove('hide');

      .catch(function (err) { if (err !== null) failed[part] = true; return false; })

  function skeleton() {

    var p = current(), d = cache[p.part], view = $('view');

    else if (page === 'app') renderSite(d, view, true, animate);

  function alerts(notes) {
    $('alerts').innerHTML = notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join('');

  function metric(label, value, detail) {
    return '<div class="metric"><span>' + esc(label) + '</span><span class="n">' + esc(value) + '</span>' +

  function card(label, value, detail) {
    return '<div class="card"><span class="l">' + esc(label) + '</span><span class="n">' + esc(value) + '</span>' +

  function legend(series) {
    var items = [];
    series.forEach(function (s) { (s.legend || [[s.label, s.color]]).forEach(function (l) { items.push(l); }); });

  /* ---------- Ads ---------- */

  function renderAds(d, view, animate) {
    var notes = (d.warnings || []).slice();
    if (d.sources.meta !== 'ok') notes.push(d.sources.meta === 'not_connected' ? 'Meta isn’t connected, so ad numbers are missing.' : 'Meta didn’t answer: ' + d.sources.meta);

    if (!w) { view.replaceChildren(); return; }
    var back = times(w.realReturn);
    var spendLine = period === 'today' && d.budget ? 'of ' + money(d.budget) + ' budget' : (w.costPerReservation != null ? money(w.costPerReservation) + ' per reservation' : rangeText(w));
    var revenueLine = plural(w.reservations, 'reservation', 'reservations') + (w.refunded ? ', ' + money(w.refunded) + ' refunded' : '');
    var series = [
      { label: 'Revenue', color: MAIN, area: true, get: function (r) { return r.revenue; }, text: money },
      { label: 'Ad spend', color: ALT, get: function (r) { return r.spend; }, text: money },
      { label: 'Profit', color: UP, bar: true, colorOf: function (v) { return v < 0 ? DOWN : UP; }, legend: [['Profit', UP], ['Loss', DOWN]], get: function (r) { return r.profit; }, text: money }
    ];

    var html = '<div class="sec"><div class="metrics">' +
      metric('Ad spend', money(w.spend), spendLine) +
      metric('Revenue', money(w.net), revenueLine) +
      metric('Profit', money(w.profit), back ? back + ' back on ad spend' : 'No ad spend') +
      '</div>' +
      '<div class="sechead" style="margin-top:8px"><h3>Per ' + slotWord() + '</h3>' + legend(series) + '</div><div class="chart" id="chart"></div></div>';

    var m = w.meta;
    if (m) {
      var steps = [[m.linkClicks, 'Ad clicks'], [m.landingViews, 'Site visits'], [m.checkouts, 'Reserve clicks'], [m.purchases, 'Reservations']];
      html += '<div class="sec"><h2>From ad to reservation</h2><div class="cards">' + steps.map(function (s, i) {
        var prev = i ? steps[i - 1][0] : null;
        return card(s[1], num(s[0]), prev ? Math.round(100 * s[0] / prev) + '% of ' + steps[i - 1][1].toLowerCase() : rangeText(w));
      }).join('') + '</div></div>';
    }

    var info = {};
    (d.ads || []).forEach(function (a) { info[a.id] = a; });
    var safe = function (u) { return u && /^https:\/\//.test(u) ? u : null; };
    // Only the ads running now; the totals above still count every ad.
    var live = (w.ads || []).filter(function (n) { return info[n.id] && info[n.id].status === 'Active'; });
    var structure = (d.campaigns || []).filter(function (c) { return c.status === 'Active'; }).map(function (c) {
      return c.name + ' · ' + c.status + (c.dailyBudget ? ' · ' + money(c.dailyBudget) + ' a day' : '');
    }).concat((d.adsets || []).filter(function (a) { return a.status === 'Active'; }).map(function (a) { return a.name + ' · ' + a.status; }));
    html += '<div class="sec"><div><h2>Ads</h2><p class="sub" style="margin-top:2px">' + esc(structure.join('  /  ')) + '</p></div>' +
      '<div class="ads">' + (live.length ? live.map(function (n) {
        var a = info[n.id];
        var pic = safe(a.picture), link = safe(a.link);
        var img = (pic ? '<img src="' + esc(pic) + '" alt="' + esc(a.name) + '" loading="lazy" referrerpolicy="no-referrer">' : '') +
          (a.video ? '<span class="badge tag">Video</span>' : '');
        var rows = [['Spent', money(n.spend)], ['Reservations', num(n.purchases)]];
        if (n.costPerPurchase != null) rows.push(['Cost each', money(n.costPerPurchase)]);
        rows.push(['Clicks', num(n.linkClicks)]);
        var state = a.status && a.status !== 'Active' ? '<span class="badge" style="margin-top:8px">' + esc(a.status) + '</span>' : '';
        return '<article class="ad">' +
          (link ? '<a class="pic" href="' + esc(link) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(a.name) + '">' + img + '</a>' : '<div class="pic">' + img + '</div>') +
          '<div class="txt"><p class="name">' + esc(a.name) + '</p>' + rows.map(function (r) {
            return '<p class="row"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></p>';
          }).join('') + state + '</div></article>';
      }).join('') : '<p class="sub">No ads are live right now.</p>') + '</div></div>';

    view.innerHTML = html;
    var draw = function (a) { graph($('chart'), slots(d, w), series, function (v) { return (v < 0 ? '−$' : '$') + Math.abs(v); }, false, a); };
    redraw = function () { draw(false); };
    draw(animate);
  }

  /* ---------- Website and App ---------- */

  function renderSite(d, view, app, animate) {
    if (d.source !== 'ok') {
      alerts([d.source === 'not_connected' ? 'PostHog isn’t connected, so these numbers are missing.' : 'PostHog didn’t answer: ' + d.source]);
      view.replaceChildren();
      return;
    }
    alerts([]);
    var w = pick(d.periods);
    if (!w) { view.replaceChildren(); return; }
    var share = function (n) { return w.visitors ? Math.round(100 * n / w.visitors) + '% of visitors' : ''; };
    var tiles = app ? [
      card('App installs', num(w.installs), rangeText(w)),
      card('Active app users', num(w.activeUsers), rangeText(w)),
      card('Users transcribing', num(w.transcribers), rangeText(w)),
      card('Minutes transcribed', num(w.minutes), rangeText(w)),
      card('Transcription cost', money(w.cost), rangeText(w))
    ] : [
      card('Website visitors', num(w.visitors), rangeText(w)),
      card('Reserve clicks', num(w.reserveClicks), share(w.reserveClicks)),
      card('Beta signups', num(w.betaSignups), share(w.betaSignups)),
      card('Reservations paid', num(w.reservationsPaid), share(w.reservationsPaid))
    ];
    var series = app ? [
      { label: 'Active app users', color: 'var(--lime)', get: function (r) { return r.activeUsers; }, text: num }
    ] : [
      { label: 'Website visitors', color: 'var(--lime)', get: function (r) { return r.visitors; }, text: num }
    ];
    view.innerHTML = '<div class="cards c' + tiles.length + '">' + tiles.join('') + '</div>' +
      '<div class="sec"><div class="sechead"><h3>' + esc(series[0].label) + ' per ' + slotWord() + '</h3><span class="sub small">' + esc(rangeText(w)) + '</span></div><div class="chart" id="chart"></div></div>' +
      '<p class="sub small">The same counts as the Morning dashboard in PostHog, on whole days in Singapore time.</p>';
    var draw = function (a) { graph($('chart'), slots(d, w), series, num, true, a); };
    redraw = function () { draw(false); };
    draw(animate);
  }

  /* ---------- Costs ---------- */

  var SECTIONS = [['product', 'Product'], ['marketing', 'Marketing'], ['tools', 'Tools'], ['hardware', 'Hardware']];
  function priceText(c) {
    if (c.amount == null) return '<span class="unknown">Price unknown</span>';
    if (c.amount === 0) return 'Free';
    var t = (c.currency === 'SGD' ? 'S' : '') + money(c.amount);
    if (!c.every) return t + ' once';
    return t + (c.every === 1 ? ' a month' : c.every === 12 ? ' a year' : ' every ' + c.every + ' months');
  }
  function costRow(c) {
    var detail = [c.what, c.note].filter(Boolean).join('. ');
    var under = [];
    if (c.perMonth != null && (c.currency !== 'USD' || c.every !== 1)) under.push('About ' + money(c.perMonth) + ' a month');
    if (c.next) under.push('Next ' + niceDate(c.next));
    return '<li><div><div class="name">' + esc(c.name) + '</div><div class="sub">' + esc(detail) + '</div></div>' +
      '<div class="price">' + priceText(c) + (under.length ? '<span class="sub small">' + esc(under.join(' · ')) + '</span>' : '') + '</div></li>';
  }
  function renderCosts(d, view) {
    var t = d.totals, a = d.ads;
    var notes = (d.alerts || []).slice();
    if (a.source !== 'ok') notes.push(a.source === 'not_connected' ? 'Meta isn’t connected, so ad spend is missing.' : 'Meta didn’t answer: ' + a.source);
    alerts(notes);
    var span = a.from ? rangeText({ from: a.from, to: a.to }) : '';
    var tiles = [
      card('Per month', money(t.month), 'Services and the last 30 days of ads'),
      card('Services', money(t.monthly), 'About ' + money(t.yearly) + ' a year'),
      card('Ads, last 30 days', money(a.spend30), span),
      card('Hardware', money(t.hardware), 'NOA Labs prototype contract')
    ];
    var html = '<div class="cards">' + tiles.join('') + '</div>';
    SECTIONS.forEach(function (sec) {
      var rows = d.costs.filter(function (c) { return c.section === sec[0]; });
      var items = rows.map(costRow);
      if (sec[0] === 'marketing') {
        items.unshift('<li><div><div class="name">Meta ads</div><div class="sub">Facebook and Instagram ads. Read from Meta every 10 minutes.</div></div>' +
          '<div class="price">' + money(a.spend30) + '<span class="sub small">Last 30 days</span></div></li>');
      }
      if (!items.length) return;
      var monthly = rows.reduce(function (s, c) { return s + (c.perMonth || 0); }, 0) + (sec[0] === 'marketing' ? (a.spend30 || 0) : 0);
      var side = sec[0] === 'hardware' ? '' : money(Math.round(monthly * 100) / 100) + ' a month';
      html += '<div class="sec"><div class="sechead"><h3>' + sec[1] + '</h3><span class="sub small">' + esc(side) + '</span></div><ul class="ledger">' + items.join('') + '</ul></div>';
    });
    var unknown = t.unknown.length ? ' Not counted because the price isn’t known: ' + t.unknown.join(', ') + '.' : '';
    html += '<p class="sub small">Prices come from the receipts in Gmail. Singapore dollars count at US$' + d.rates.SGD + '.' + esc(unknown) + '</p>';
    view.innerHTML = html;
  }

  /* ---------- graph: lines and bars over 30 days, with a reading for the day under the pointer ---------- */

  function niceStep(raw, whole) {
    var p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    var step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    return whole ? Math.max(1, step) : step;
  }

  function hourText(h) { return (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? ' AM' : ' PM'); }

  /// The graph's columns for the chosen period: one per hour for Today and
  /// Yesterday, one per day for the longer periods.
  function slots(d, w) {
    if ((period === 'today' || period === 'yesterday') && d.hourly && d.hourly[period]) {
      var name = period === 'today' ? 'Today' : 'Yesterday';
      return d.hourly[period].map(function (h) {
        var row = Object.assign({}, h);
        row.label = hourText(h.hour);
        row.tip = name + ', ' + hourText(h.hour);
        return row;
      });
    }
    return (d.daily || []).filter(function (r) { return r.date >= w.from && r.date <= w.to; }).map(function (r) {
      var row = Object.assign({}, r);
      row.label = niceDate(r.date);
      row.tip = longDate(r.date);
      return row;
    });
  }
  function slotWord() { return period === 'today' || period === 'yesterday' ? 'hour' : 'day'; }

  function graph(host, rows, series, axisText, whole, animate) {
    if (!host || !rows.length) return;
    var W = Math.max(280, Math.round(host.clientWidth || 600)), H = W < 500 ? 220 : 280;
    var L = 46, R = 8, T = 10, B = 28, n = rows.length;
    var values = [];
    rows.forEach(function (r) { series.forEach(function (s) { values.push(s.get(r)); }); });
    var lo = Math.min.apply(null, values.concat([0])), hi = Math.max.apply(null, values.concat([1]));
    var step = niceStep((hi - lo) / 4, whole);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    var dx = (W - L - R) / n, x0 = L + dx / 2;
    var x = function (i) { return x0 + i * dx; };
    var y = function (v) { return T + (H - T - B) * (hi - v) / (hi - lo); };
    // Columns side by side when there is room; with many narrow slots the
    // lines carry revenue and spend and only profit stays a column.
    var columns = series.length === 1 || dx >= 30;
    var cls = animate ? ' class="grow"' : '';

    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Per ' + slotWord() + '">';
    out += '<rect id="chart-band" visibility="hidden" y="' + T + '" width="' + dx.toFixed(1) + '" height="' + (H - T - B) + '" rx="4" style="fill:var(--hover)"/>';
    for (var v = lo; v <= hi + step / 2; v += step) {
      var gy = y(v).toFixed(1), zero = Math.abs(v) < step / 1000;
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" style="stroke:var(' + (zero ? '--zero' : '--grid') + ')"' + (zero ? '' : ' stroke-dasharray="2 3"') + '/>' +
        '<text x="' + (L - 8) + '" y="' + (+gy + 4) + '" text-anchor="end">' + esc(axisText(Math.round(v * 100) / 100)) + '</text>';
    }
    var bar = function (cx, bw, val, color) {
      if (!val) return '';
      var top = Math.min(y(val), y(0)), h = Math.max(1.5, Math.abs(y(val) - y(0)));
      return '<rect' + cls + ' x="' + (cx - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(3, bw / 2).toFixed(1) + '" style="fill:' + color + ';stroke:var(--c-bar-edge)"/>';
    };
    if (columns) {
      var k = series.length, gap = k > 1 ? 2 : 0;
      var bw = Math.max(2, Math.min(k > 1 ? 18 : 72, (dx * (k > 1 ? 0.74 : 0.62) - gap * (k - 1)) / k));
      var group = bw * k + gap * (k - 1);
      rows.forEach(function (r, i) {
        series.forEach(function (s, j) { var v = s.get(r); out += bar(x(i) - group / 2 + bw / 2 + j * (bw + gap), bw, v, s.colorOf ? s.colorOf(v) : s.color); });
      });
    } else {
      series.filter(function (s) { return s.bar; }).forEach(function (s) {
        var w1 = Math.max(3, Math.min(14, dx * 0.56));
        rows.forEach(function (r, i) { var v = s.get(r); out += bar(x(i), w1, v, s.colorOf ? s.colorOf(v) : s.color); });
      });
      series.filter(function (s) { return !s.bar; }).forEach(function (s) {
        var path = rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(s.get(r)).toFixed(1); }).join(' ');
        // A lime wash under the main line, fading to nothing at zero.
        if (s.area) {
          out += '<defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lime);stop-opacity:var(--area-top)"/><stop offset="1" style="stop-color:var(--lime);stop-opacity:0"/></linearGradient></defs>' +
            '<path' + cls + ' d="' + path + ' L' + x(n - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z" fill="url(#wash)"/>';
        }
        out += '<path' + (animate ? ' class="draw" pathLength="1"' : '') + ' d="' + path + '" fill="none" style="stroke:' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      });
    }
    // As many labels under the columns as fit without touching.
    var every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 64))));
    rows.forEach(function (r, i) {
      if (i % every) return;
      out += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(r.label) + '</text>';
    });
    var lines = columns ? [] : series.filter(function (s) { return !s.bar; });
    out += '<g id="chart-mark" visibility="hidden">' + (columns ? '' : '<line y1="' + T + '" y2="' + (H - B) + '" style="stroke:var(--zero)"/>') +
      lines.map(function (s) { return '<circle r="4" style="fill:' + s.color + ';stroke:var(--bg)" stroke-width="2"/>'; }).join('') + '</g></svg>';
    host.innerHTML = out + '<div class="tip" id="chart-tip"></div>';

    var svg = host.querySelector('svg'), mark = host.querySelector('#chart-mark'), band = host.querySelector('#chart-band'), tip = host.querySelector('#chart-tip');
    function show(e) {
      var box = svg.getBoundingClientRect();
      var scale = W / box.width;
      var i = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - box.left) * scale - L) / dx)));
      var r = rows[i];
      if (columns) {
        band.setAttribute('visibility', 'visible');
        band.setAttribute('x', (x(i) - dx / 2).toFixed(1));
      } else {
        mark.setAttribute('visibility', 'visible');
        mark.querySelector('line').setAttribute('x1', x(i));
        mark.querySelector('line').setAttribute('x2', x(i));
        Array.prototype.forEach.call(mark.querySelectorAll('circle'), function (c, k) {
          c.setAttribute('cx', x(i));
          c.setAttribute('cy', y(lines[k].get(r)));
        });
      }
      tip.innerHTML = '<b>' + esc(r.tip) + '</b>' + series.map(function (s) {
        var v = s.get(r);
        return '<div><span><i class="dot" style="background:' + (s.colorOf ? s.colorOf(v) : s.color) + '"></i>' + esc(s.colorOf && v < 0 ? 'Loss' : s.label) + '</span><span>' + esc(s.text(v)) + '</span></div>';
      }).join('');
      var px = x(i) / scale, tw = tip.offsetWidth, half = dx / scale / 2;
      var left = px + half + 8 + tw > box.width ? px - half - 8 - tw : px + half + 8;
      tip.style.transform = 'translate(' + Math.max(0, left).toFixed(0) + 'px, 8px)';
      tip.classList.add('on');
    }
    function hide() { mark.setAttribute('visibility', 'hidden'); band.setAttribute('visibility', 'hidden'); tip.classList.remove('on'); }
    host.onpointermove = show;
    host.onpointerdown = show;
    host.onpointerleave = hide;
  }

  /* ---------- Posts ---------- */

  // Approved means Julien said yes; only Scheduled means the post is in Meta
  // Business Suite and will go out. Nothing here publishes to Instagram.
  var STATE = { suggested: ['To review', 'warn'], review: ['To review', 'warn'], changes: ['Changes requested', ''], approved: ['Approved, not in Meta yet', 'warn'], scheduled: ['Scheduled in Meta', 'info'], posted: ['Posted', ''] };
  var GROUPS = [
    ['review', 'To review', 'Nothing to review. New post ideas will appear here.'],
    ['approved', 'Approved, not in Meta yet', 'Every approved post is scheduled in Meta.'],
    ['scheduled', 'Scheduled in Meta', 'Nothing scheduled on Instagram yet.'],
    ['posted', 'Posted', 'Nothing posted yet.']
  ];
  // The current time as "YYYY-MM-DDTHH:MM" in the page's time zone, to compare with post dates.
  function nowLocal(zone) {
    var f = new Intl.DateTimeFormat('en-CA', { timeZone: zone || 'Asia/Singapore', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    var v = {};
    f.formatToParts(new Date()).forEach(function (x) { v[x.type] = x.value; });
    return v.year + '-' + v.month + '-' + v.day + 'T' + v.hour + ':' + v.minute;
  }
  var NOW = nowLocal();
  function isPast(p) { return !!p.when && p.when <= NOW; }
  // A scheduled post whose time has passed has gone out from Meta.
  function shownStatus(p) { return p.status === 'scheduled' && isPast(p) ? 'posted' : p.status; }
  function groupOf(p) { var s = shownStatus(p); return s === 'approved' || s === 'scheduled' || s === 'posted' ? s : 'review'; }
  function whenText(v) {
    if (!v) return 'No date yet';
    var parts = v.split('T');
    return longDate(parts[0]) + ', ' + (parts[1] || '').slice(0, 5);
  }

  function savePost(id, patch, msg) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    msg.textContent = 'Saving…';
    patch.id = id;
    fetch(API + '?part=posts', { method: 'POST', headers: { 'x-dashboard-key': code, 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (json) {
        var d = cache.posts, moved = false;
        d.posts = d.posts.map(function (p) {
          if (p.id !== id) return p;
          moved = p.status !== json.post.status || p.when !== json.post.when;
          return json.post;
        });
        // Only redraw when the post changes place, so typing isn't interrupted.
        if (moved && page === 'posts') render();
        else { msg.textContent = 'Saved'; setTimeout(function () { msg.textContent = ''; }, 1800); }
      })
      .catch(function () { msg.textContent = 'Not saved. Try again in a moment.'; });
  }

  // The post's picture: opens the reel to play, or the photo at full size.
  function postPicture(p) {
    var pic = el('button', { type: 'button', class: 'pic' + (p.video ? ' reel' : ''), 'aria-label': (p.video ? 'Play ' : 'Open ') + (p.name || 'post'), onclick: function () { openPost(p); } },
      el('img', { src: p.image || '', alt: p.alt || p.name || 'Post image', loading: 'lazy' }));
    if (p.video) {
      var play = el('span', { class: 'play' });
      play.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
      pic.appendChild(play);
    }
    return pic;
  }

  function openPost(p) {
    var dlg = $('viewer');
    var close = el('button', { type: 'button', class: 'x', 'aria-label': 'Close', onclick: function () { dlg.close(); } });
    close.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.500 1.500l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></svg>';
    var media = p.video
      ? el('video', { src: p.video, poster: p.image || false, controls: true, autoplay: true, playsinline: true, preload: 'auto' })
      : el('img', { src: p.image || '', alt: p.alt || p.name || 'Post image' });
    dlg.replaceChildren(el('div', { class: 'modal' },
      el('header', {}, el('b', { text: p.name || 'Post' }), close),
      el('div', { class: 'stage' }, media)));
    if (!dlg.dataset.ready) {
      dlg.dataset.ready = '1';
      // Closing stops the video.
      dlg.addEventListener('close', function () { dlg.replaceChildren(); });
      dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    }
    dlg.showModal();
  }

  function postCard(p) {
    var g = groupOf(p);
    var locked = g === 'scheduled' || g === 'posted';
    var msg = el('span', { class: 'sub small', role: 'status' });

    var cap = el('textarea', { disabled: locked });
    cap.value = p.caption || '';
    var chars = el('span', { class: 'sub small', text: cap.value.length + ' / 2,200 characters' });
    cap.addEventListener('input', function () { chars.textContent = cap.value.length + ' / 2,200 characters'; });
    cap.addEventListener('change', function () { if (cap.value !== (p.caption || '')) savePost(p.id, { caption: cap.value }, msg); });

    var when = el('input', { type: 'datetime-local', disabled: locked });
    when.value = p.when || '';
    when.addEventListener('change', function () { if (when.value !== (p.when || '')) savePost(p.id, { when: when.value }, msg); });

    var actions = el('div', { class: 'actions' });
    var noteBox = null;
    if (g === 'review') {
      var note = el('textarea', { placeholder: 'What should change?' });
      note.value = p.note || '';
      noteBox = el('div', { class: p.status === 'changes' ? '' : 'hide' },

        el('ol', { class: 'steps' }, f.steps.map(function (s) {
          return el('li', { class: s.email ? 'mailstep' : '' }, el('p', { text: s.title }), s.detail ? el('p', { class: 'sub', text: s.detail }) : null,
            s.email ? el('button', { type: 'button', class: 'btn', text: 'Read the email', onclick: function () { openMail(s.email, edit); } }) : null);
        })),
        el('div', { class: 'foot' }, el('span', { class: 'sub', text: f.stats || '' }),
          edit ? el('a', { class: 'link', href: edit.url, target: '_blank', rel: 'noopener', text: edit.label + ' →' }) : null));
    });
    view.replaceChildren.apply(view, [
      el('p', { class: 'sub', text: 'Open an email to read or edit it as people will see it, then confirm it or ask Claude for changes. Claude builds confirmed emails in Loops, and In Loops shows them in the order they go out.' })
    ].concat(draftNodes, [
      el('div', { class: 'sec' }, el('h2', { text: 'Live in Loops now' }), el('div', { class: 'flows' }, flows)),
      el('p', { class: 'sub small', text: 'People counts are live. Steps and email numbers were checked in Loops on ' + niceDate(d.checked) + '.' })
    ]));
  }

  /* ---------- wiring ---------- */

  function go(id, fromHash) {
    if (!PAGES.some(function (p) { return p.id === id; })) id = 'ads';
    page = id;
    if (!fromHash && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    render(true);
    load(current().part, false);
    window.scrollTo(0, 0);
  }

  ['nav', 'tabs'].forEach(function (id) {
    PAGES.forEach(function (p) {
      var b = el('button', { type: 'button', 'data-page': p.id, onclick: function () { go(p.id); } });
      b.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">' + p.icon + '</svg><span>' + esc(p.name) + '</span>';
      $(id).appendChild(b);
    });
  });
  PERIODS.forEach(function (p) {
    $('switch').appendChild(el('button', { type: 'button', 'data-period': p[0], text: p[1], onclick: function () {
      period = p[0]; write('larkin-dash-period', period); render(true);
    } }));
  });
  $('refresh').addEventListener('click', function () { load(current().part, true); });

  /* ---------- light and dark ---------- */

  var MOON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.200 1.600a.600.600 0 0 1 .200.700 5.400 5.400 0 0 0 7.300 7.300.600.600 0 0 1 .800.800A6.800 6.800 0 1 1 5.500 1.500a.600.600 0 0 1 .700.100z"/></svg>';
  var SUN = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.200" fill="currentColor"/><path d="M8 1.200v1.600M8 13.200v1.600M1.200 8h1.600M13.200 8h1.600M3.200 3.200l1.100 1.100M11.700 11.700l1.100 1.100M12.800 3.200l-1.100 1.100M4.300 11.700l-1.100 1.100" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round"/></svg>';
  function paintTheme() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('theme-color').setAttribute('content', dark ? '#0E0E10' : '#FFFFFF');
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-switch]'), function (b) {
      var words = dark ? 'Light mode' : 'Dark mode';
      b.innerHTML = (dark ? SUN : MOON) + (b.classList.contains('icon') ? '' : '<span>' + words + '</span>');
      b.setAttribute('aria-label', words);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-switch]'), function (b) {
    b.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      write('larkin-dash-theme', next);
      paintTheme();
    });
  });
  // Until a theme is chosen here, follow the device when it changes.
  if (window.matchMedia) {
    var media = matchMedia('(prefers-color-scheme: dark)');
    var follow = function (e) {
      if (read('larkin-dash-theme')) return;
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      paintTheme();
    };
    if (media.addEventListener) media.addEventListener('change', follow); else if (media.addListener) media.addListener(follow);
  }
  paintTheme();
  var lastW = 0;
  window.addEventListener('resize', function () {
    var host = $('chart');
    if (host && redraw && host.clientWidth !== lastW) { lastW = host.clientWidth; redraw(); }
  });
  window.addEventListener('hashchange', function () { go(location.hash.slice(1), true); });
  $('mail').addEventListener('click', function (e) { if (e.target === $('mail')) $('mail').close(); });
  $('lock-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim();
    if (!code) return;
    write(KEY, code);
    $('lock-msg').textContent = 'Checking…';
    load(current().part, true);
  });
  // Coming back to the page (or the home-screen app) fetches fresh numbers.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load(current().part, false);
  });

  page = PAGES.some(function (p) { return p.id === location.hash.slice(1); }) ? location.hash.slice(1) : 'ads';
  if (read(KEY)) { $('shell').classList.remove('hide'); load(current().part, true); }
  else showLock();
})();
</script>
</body>
</html>
