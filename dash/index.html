<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Larkin</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larkin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Larkin's private dashboard, laid out like a payments dashboard: slate
   text, hairlines, a purple accent, tabs with an underline, soft button
   shadows and short transitions. Larkin's own: DM Sans and the lime logo. */
@font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/fonts/dm-sans-latin.woff2") format("woff2"); }
:root {
  --title: #1A1B25;
  --text: #353A44;
  --sub: #687385;
  --icon: #6C7688;
  --line: #EBEEF1;
  --ctl: #D8DEE4;
  --ctl-hover: #C0C8D2;
  --subtle: #F6F8FA;
  --hover: #F5F6F8;
  --accent: #635BFF;
  --accent-text: #533AFD;
  --accent-hover: #5851EB;
  --lime: #D2ED28;
  --side: 250px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: #FFFFFF; }
body {
  margin: 0; background: #FFFFFF; color: var(--text);
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px; line-height: 20px; font-weight: 400;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1 { font-size: 28px; line-height: 36px; letter-spacing: -0.01em; font-weight: 700; color: var(--title); margin: 0; }
h2 { font-size: 20px; line-height: 28px; letter-spacing: -0.005em; font-weight: 700; color: var(--title); margin: 0; }
h3 { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--title); margin: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
.sub { color: var(--sub); }
.small { font-size: 12px; line-height: 16px; }
.hide { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus { outline: none; }
:focus-visible { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px rgba(99, 91, 255, .28) !important; border-radius: 6px; }

/* Sidebar */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); padding: 14px 12px; border-right: 1px solid var(--line); background: #FFFFFF; display: flex; flex-direction: column; gap: 18px; }
.acct { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; font-weight: 600; color: var(--title); }
.mark { width: 24px; height: 24px; border-radius: 6px; background: var(--lime); display: grid; place-items: center; flex: none; }
.mark svg { width: 24px; height: 24px; fill: #151515; display: block; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; height: 30px; padding: 0 8px; border-radius: 6px; text-align: left; color: var(--text); font-weight: 500; transition: background-color .15s, color .15s; }
.nav svg, .tabbar svg { width: 16px; height: 16px; flex: none; color: var(--icon); transition: color .15s; }
.nav button:hover { background: var(--hover); }
.nav button:active { background: var(--line); }
.nav button[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.nav button[aria-current="page"] svg { color: var(--accent-text); }

.main { margin-left: var(--side); padding: 28px 40px 96px; }
.inner { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.stack { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.tabbar, .phone-acct { display: none; }

.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.headside { display: flex; align-items: center; gap: 12px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px;
  background: #FFFFFF; color: var(--text); font-weight: 600; white-space: nowrap; text-decoration: none;
  box-shadow: 0 0 0 1px var(--ctl), 0 1px 1px rgba(0, 0, 0, .08);
  transition: box-shadow .15s, background-color .15s, color .15s;
}
.btn:hover { box-shadow: 0 0 0 1px var(--ctl-hover), 0 2px 5px rgba(64, 68, 82, .12); }
.btn:active { background: var(--subtle); box-shadow: 0 0 0 1px var(--ctl-hover); }
.btn svg { width: 12px; height: 12px; color: var(--icon); }
.btn.primary { background: var(--accent); color: #FFFFFF; box-shadow: 0 0 0 1px var(--accent), 0 1px 1px rgba(0, 0, 0, .12); }
.btn.primary:hover { background: var(--accent-hover); box-shadow: 0 0 0 1px var(--accent-hover), 0 2px 5px rgba(64, 68, 82, .16); }
.btn[disabled] { color: #A3ACBA; cursor: default; box-shadow: 0 0 0 1px var(--line); }
.btn.spin svg { animation: turn .8s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.link { color: var(--accent-text); font-weight: 600; text-decoration: none; transition: color .15s; }
.link:hover { color: var(--title); }

/* Period tabs with an underline, sitting on the page's hairline */
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-top: -8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { height: 38px; font-weight: 600; color: var(--sub); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; flex: none; transition: color .15s, border-color .15s; border-radius: 0; }
.tabs button:hover { color: var(--title); border-bottom-color: var(--ctl); }
.tabs button[aria-pressed="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }

.note { background: var(--subtle); border-radius: 8px; padding: 12px 16px; color: var(--text); }
.note p + p { margin-top: 4px; }

/* Content arrives with a short rise */
.enter > * { animation: rise .32s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .04s; }
.enter > *:nth-child(3) { animation-delay: .08s; }
.enter > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.metrics { display: grid; gap: 32px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric .n { display: block; font-size: 24px; line-height: 32px; color: var(--title); margin: 2px 0; white-space: nowrap; }

.sec { display: flex; flex-direction: column; gap: 16px; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--sub); font-size: 12px; line-height: 16px; }
.legend span, .tip div span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }

.cards { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; background: #FFFFFF; }
.card .l { font-weight: 600; color: var(--title); }
.card .n { display: block; font-size: 20px; line-height: 28px; color: var(--title); margin: 8px 0 2px; white-space: nowrap; }

/* Graph */
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; font-size: 12px; fill: var(--sub); }
.chart .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; }
.chart .grow { transform-box: fill-box; animation: fade .5s ease both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.tip {
  position: absolute; top: 0; left: 0; pointer-events: none; background: #FFFFFF; border-radius: 8px; padding: 10px 12px; min-width: 164px; white-space: nowrap;
  box-shadow: 0 0 0 1px rgba(136, 152, 170, .1), 0 15px 35px rgba(49, 49, 93, .1), 0 5px 15px rgba(0, 0, 0, .08);
  font-size: 12px; line-height: 16px; opacity: 0; transition: opacity .12s, transform .08s ease-out;
}
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 500; color: var(--sub); margin-bottom: 6px; }
.tip div { display: flex; justify-content: space-between; gap: 20px; padding: 2px 0; color: var(--text); }
.tip div span:last-child { color: var(--title); font-weight: 600; }

/* Ads */
.ads { display: grid; gap: 16px; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; }
.ad { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #FFFFFF; transition: box-shadow .2s, transform .2s var(--ease); }
.ad:hover { box-shadow: 0 7px 14px rgba(48, 49, 61, .08), 0 3px 6px rgba(0, 0, 0, .08); transform: translateY(-1px); }
.ad .pic { display: block; position: relative; aspect-ratio: 9 / 16; background: var(--subtle); }
.ad .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad .tag { position: absolute; left: 8px; top: 8px; }
.ad .txt { padding: 12px 14px 14px; }
.ad .name { font-weight: 600; color: var(--title); margin-bottom: 6px; text-wrap: balance; }
.ad .txt p { color: var(--sub); }
.ad .txt p b { font-weight: 600; color: var(--title); }
.ad .txt .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.ad .txt .row span:last-child { color: var(--title); font-weight: 500; }

.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 16px; font-weight: 500; background: var(--line); color: #545969; white-space: nowrap; }
.badge.ok { background: #D7F7C2; color: #006908; }
.badge.info { background: #CFF5F6; color: #0055BC; }
.badge.warn { background: #FCEDB9; color: #A82C00; }

/* Posts */
.ig { max-width: 420px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-radius: 8px; overflow: hidden; }
.ig button, .ig div { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--subtle); display: block; border-radius: 0; }
.ig img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s var(--ease), opacity .2s; }
.ig button:hover img { transform: scale(1.03); }
.ig .pending img { opacity: .45; }
.ig .d { position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: var(--title); border-radius: 4px; font-size: 11px; line-height: 16px; font-weight: 600; padding: 1px 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
.toggle input { width: 14px; height: 14px; accent-color: var(--accent); margin: 0; }
.post { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 20px; align-items: start; scroll-margin-top: 16px; background: #FFFFFF; }
.post > img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; display: block; background: var(--subtle); }
.pbody { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
.prow .name { font-weight: 600; color: var(--title); }
.prow .state { display: inline-flex; align-items: center; gap: 8px; }
label.f { display: block; font-weight: 500; color: var(--title); }
label.f > textarea, label.f > input { margin-top: 4px; font-weight: 400; }
textarea, input[type="datetime-local"], input[type="password"] {
  width: 100%; background: #FFFFFF; border: 0; border-radius: 6px; padding: 6px 10px; color: var(--title); font-size: 14px; line-height: 20px;
  box-shadow: 0 0 0 1px var(--ctl), 0 1px 1px rgba(0, 0, 0, .06); transition: box-shadow .15s;
}
textarea:hover, input:hover { box-shadow: 0 0 0 1px var(--ctl-hover), 0 1px 1px rgba(0, 0, 0, .06); }
textarea { min-height: 76px; resize: vertical; display: block; }
input[type="datetime-local"] { max-width: 230px; display: block; }
textarea:disabled, input:disabled { background: var(--subtle); color: var(--sub); box-shadow: 0 0 0 1px var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Emails: each flow as a timeline */
.flows { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.flow { padding: 20px; }
.flow .count { font-size: 24px; line-height: 32px; color: var(--title); margin: 8px 0 2px; }
.steps { list-style: none; margin: 20px 0 4px; padding: 0; }
.steps li { position: relative; padding: 0 0 20px 26px; }
.steps li::before { content: ""; position: absolute; left: 3px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 2px var(--ctl-hover); }
.steps li.mailstep::before { box-shadow: 0 0 0 2px var(--accent); background: var(--accent); }
.steps li::after { content: ""; position: absolute; left: 7px; top: 19px; bottom: -1px; width: 1px; background: var(--ctl); }
.steps li:last-child { padding-bottom: 12px; }
.steps li:last-child::after { display: none; }
.steps li > p:first-child { color: var(--title); font-weight: 500; }
.steps .btn { margin-top: 8px; }
.flow .foot { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* Pop-up, with the email set in Arial the way a mail app shows it */
dialog { border: 0; padding: 0; background: transparent; width: min(700px, calc(100vw - 24px)); max-height: calc(100vh - 24px); color: var(--text); overflow: visible; }
dialog::backdrop { background: rgba(48, 49, 61, .5); animation: fade .2s ease both; }
dialog[open] .modal { animation: pop .25s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.modal { background: #FFFFFF; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 24px); box-shadow: 0 15px 35px rgba(48, 49, 61, .08), 0 5px 15px rgba(0, 0, 0, .12); }
.modal header, .modal footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; }
.modal header { border-bottom: 1px solid var(--line); }
.modal header b { font-size: 16px; line-height: 24px; font-weight: 700; color: var(--title); }
.modal footer { border-top: 1px solid var(--line); justify-content: flex-end; background: var(--subtle); }
.x { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--icon); transition: background-color .15s, color .15s; }
.x:hover { background: var(--hover); color: var(--title); }
.x svg { width: 12px; height: 12px; }
.mail { overflow: auto; font-family: Arial, Helvetica, sans-serif; }
.inbox { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 11px 20px; background: #F2F6FC; border-bottom: 1px solid #E3E7EC; font-size: 14px; line-height: 20px; color: #202124; }
.inbox b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inbox .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #5F6368; }
.inbox .line b { color: #202124; }
.inbox .time { font-weight: 700; font-size: 12px; }
.letter { padding: 22px 24px 28px; }
.letter .subject { font-size: 22px; line-height: 28px; font-weight: 400; color: #1F1F1F; margin: 0 0 18px; }
.from { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 20px; }
.from .av { width: 40px; height: 40px; border-radius: 50%; background: #151515; color: #FFFFFF; display: grid; place-items: center; font-size: 17px; }
.from .who { font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.from .who b { font-weight: 700; color: #1F1F1F; }
.from .who span, .from .time { color: #5F6368; font-size: 12px; }
.letter .body { font-size: 14px; line-height: 21px; color: #000000; white-space: pre-wrap; overflow-wrap: anywhere; padding-left: 52px; }
.letter .footer { font-size: 11px; line-height: 16px; color: #8A8A8A; padding-left: 52px; margin-top: 28px; }

/* Loading placeholders */
.sk { border-radius: 6px; background: linear-gradient(90deg, #EBEEF1 25%, #F6F8FA 37%, #EBEEF1 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
@keyframes sk { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

/* Lock */
.lock { max-width: 340px; margin: 0 auto; padding: 18vh 16px 0; }
.lock .acct { padding: 0; margin-bottom: 20px; font-size: 16px; }
.lock form { display: flex; gap: 8px; margin-top: 16px; }
.lock input { flex: 1; min-width: 0; height: 36px; }
.lock .btn { height: 36px; padding: 0 16px; }
.msg { min-height: 20px; margin-top: 10px; }

@media (max-width: 1320px) { .ads { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1080px) {
  .ads { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards.c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .main { padding: 28px 28px 96px; }
}
@media (max-width: 760px) {
  .side { display: none; }
  .main { margin-left: 0; padding: calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); }
  .inner { gap: 20px; }
  .stack { gap: 28px; }
  .phone-acct { display: flex; padding: 0; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0 0; z-index: 5;
    background: #FFFFFF; border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 48px; border-radius: 8px; color: var(--sub); font-weight: 500; font-size: 11px; line-height: 14px; transition: color .15s, background-color .15s; }
  .tabbar svg { width: 20px; height: 20px; }
  .tabbar button:active { background: var(--hover); }
  .tabbar button[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
  .tabbar button[aria-current="page"] svg { color: var(--accent-text); }
  h1 { font-size: 24px; line-height: 32px; }
  .btn { height: 32px; }
  .tabs { gap: 20px; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
  .cards, .cards.c5 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ads { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ad:hover { transform: none; box-shadow: none; }
  .post { grid-template-columns: minmax(0, 1fr); }
  .post > img { max-width: 200px; }
  .flows { grid-template-columns: minmax(0, 1fr); }
  .inbox { grid-template-columns: minmax(0, 1fr) auto; }
  .inbox .line { grid-column: 1 / -1; grid-row: 2; }
  .letter { padding: 18px 16px 24px; }
  .letter .body, .letter .footer { padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<section class="lock hide" id="lock">
  <div class="acct"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#monogram"/></svg></span>Larkin</div>
  <p class="sub">Enter the passcode to open the dashboard.</p>
  <form id="lock-form">
    <input id="code" type="password" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode">
    <button class="btn primary" type="submit">Continue</button>
  </form>
  <p class="msg sub" id="lock-msg" role="status"></p>
</section>

<div id="shell" class="hide">
  <aside class="side">
    <div class="acct"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#monogram"/></svg></span>Larkin</div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main">
    <div class="inner">
      <div class="acct phone-acct"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#monogram"/></svg></span>Larkin</div>
      <div class="head">
        <h1 id="title">Ads</h1>
        <div class="headside">
          <span class="sub small" id="updated"></span>
          <button class="btn" id="refresh" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M13.6 1.8v3.4h-3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Refresh</span></button>
        </div>
      </div>
      <div class="tabs" id="switch" role="group" aria-label="Date range"></div>
      <div class="note hide" id="alerts"></div>
      <div class="stack" id="view"></div>
    </div>
  </main>
  <nav class="tabbar" id="tabs" aria-label="Sections"></nav>
</div>

<dialog id="mail" aria-label="Email preview"></dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Larkin's "l." monogram -->
  <symbol id="monogram" viewBox="0 0 24 24"><rect x="8.2" y="5" width="3.2" height="14"/><circle cx="15.4" cy="17.1" r="1.9"/></symbol>
</svg>

<script>
(function () {
  'use strict';

  /* ---------- loading ---------- */

  function showLock(message) {
    $('shell').classList.add('hide');

  }

  function load(part, force) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    if (loading[part]) return;
    var have = cache[part];
    if (have && !force && Date.now() - new Date(have.updatedAt).getTime() < 60000) return;
    loading[part] = true;

    fetch(API + '?part=' + part, { headers: { 'x-dashboard-key': code }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { write(KEY, null); showLock('That passcode didn’t work.'); throw null; }
        if (!r.ok) throw new Error('status ' + r.status);

  /* ---------- page frame ---------- */

  /* ---------- graph: lines and bars over 30 days, with a reading for the day under the pointer ---------- */

  function niceStep(raw, whole) {
    var p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    var step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    return whole ? Math.max(1, step) : step;
  }

  function graph(host, rows, series, axisText, whole, animate) {
    if (!host || !rows.length) return;
    var W = Math.max(280, Math.round(host.clientWidth || 600)), H = W < 500 ? 220 : 280;
    var L = 46, R = 12, T = 10, B = 28, n = rows.length;
    var values = [];
    rows.forEach(function (r) { series.forEach(function (s) { values.push(s.get(r)); }); });
    var lo = Math.min.apply(null, values.concat([0])), hi = Math.max.apply(null, values.concat([1]));
    var step = niceStep((hi - lo) / 4, whole);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    var dx = (W - L - R - 16) / Math.max(1, n - 1), x0 = L + 8;
    var x = function (i) { return x0 + i * dx; };
    var y = function (v) { return T + (H - T - B) * (hi - v) / (hi - lo); };

    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Per day, last 30 days">';
    for (var v = lo; v <= hi + step / 2; v += step) {
      var gy = y(v).toFixed(1), zero = Math.abs(v) < step / 1000;
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="' + (zero ? '#C0C8D2' : '#EBEEF1') + '"' + (zero ? '' : ' stroke-dasharray="2 3"') + '/>' +
        '<text x="' + (L - 8) + '" y="' + (+gy + 4) + '" text-anchor="end">' + esc(axisText(Math.round(v * 100) / 100)) + '</text>';
    }
    series.filter(function (s) { return s.bar; }).forEach(function (s) {
      var bw = Math.max(3, Math.min(14, dx * 0.56));
      rows.forEach(function (r, i) {
        var val = s.get(r);
        if (!val) return;
        var top = Math.min(y(val), y(0)), h = Math.max(1.5, Math.abs(y(val) - y(0)));
        out += '<rect' + (animate ? ' class="grow"' : '') + ' x="' + (x(i) - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + s.color + '"/>';
      });
    });
    series.filter(function (s) { return !s.bar; }).forEach(function (s) {
      var path = rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(s.get(r)).toFixed(1); }).join(' ');
      out += '<path' + (animate ? ' class="draw" pathLength="1"' : '') + ' d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    var marks = W < 500 ? [0, n - 1] : [0, 7, 14, 21, n - 1].filter(function (i, k, a) { return i < n && a.indexOf(i) === k; });
    marks.forEach(function (i) {
      var anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      var tx = i === 0 ? L : i === n - 1 ? W - R : x(i);
      out += '<text x="' + tx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">' + esc(niceDate(rows[i].date)) + '</text>';
    });
    out += '<g id="chart-mark" visibility="hidden"><line y1="' + T + '" y2="' + (H - B) + '" stroke="#C0C8D2"/>' +
      series.filter(function (s) { return !s.bar; }).map(function (s) { return '<circle r="4" fill="' + s.color + '" stroke="#FFFFFF" stroke-width="2"/>'; }).join('') + '</g></svg>';
    host.innerHTML = out + '<div class="tip" id="chart-tip"></div>';

    var svg = host.querySelector('svg'), mark = host.querySelector('#chart-mark'), tip = host.querySelector('#chart-tip');
    var lines = series.filter(function (s) { return !s.bar; });
    function show(e) {
      var box = svg.getBoundingClientRect();
      var scale = W / box.width;
      var i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - box.left) * scale - x0) / dx)));
      var r = rows[i];
      mark.setAttribute('visibility', 'visible');
      mark.querySelector('line').setAttribute('x1', x(i));
      mark.querySelector('line').setAttribute('x2', x(i));
      Array.prototype.forEach.call(mark.querySelectorAll('circle'), function (c, k) {
        c.setAttribute('cx', x(i));
        c.setAttribute('cy', y(lines[k].get(r)));
      });
      tip.innerHTML = '<b>' + esc(longDate(r.date)) + '</b>' + series.map(function (s) {
        return '<div><span><i class="dot" style="background:' + s.color + '"></i>' + esc(s.label) + '</span><span>' + esc(s.text(s.get(r))) + '</span></div>';
      }).join('');
      var px = x(i) / scale, tw = tip.offsetWidth;
      var left = px + 14 + tw > box.width ? px - 14 - tw : px + 14;
      tip.style.transform = 'translate(' + Math.max(0, left).toFixed(0) + 'px, 8px)';
      tip.classList.add('on');
    }
    function hide() { mark.setAttribute('visibility', 'hidden'); tip.classList.remove('on'); }
    host.onpointermove = show;
    host.onpointerdown = show;
    host.onpointerleave = hide;
  }

  /* ---------- Posts ---------- */

  var STATE = { suggested: ['To review', 'warn'], review: ['To review', 'warn'], changes: ['Changes requested', ''], approved: ['Approved', 'ok'], scheduled: ['Scheduled', 'info'], posted: ['Posted', ''] };
  var GROUPS = [
    ['review', 'To review', 'Nothing to review. New post ideas will appear here.'],
    ['approved', 'Approved', 'No approved posts waiting to be scheduled.'],
    ['scheduled', 'Scheduled', 'Nothing scheduled on Instagram yet.'],
    ['posted', 'Posted', 'Nothing posted yet.']
  ];
  function groupOf(p) { return p.status === 'approved' || p.status === 'scheduled' || p.status === 'posted' ? p.status : 'review'; }
  function whenText(v) {
    if (!v) return 'No date yet';
    var parts = v.split('T');
    return longDate(parts[0]) + ', ' + (parts[1] || '').slice(0, 5);
  }

  function savePost(id, patch, msg) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    msg.textContent = 'Saving…';
    patch.id = id;
    fetch(API + '?part=posts', { method: 'POST', headers: { 'x-dashboard-key': code, 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (json) {
        var d = cache.posts, moved = false;
        d.posts = d.posts.map(function (p) {
          if (p.id !== id) return p;
          moved = p.status !== json.post.status || p.when !== json.post.when;
          return json.post;
        });
        // Only redraw when the post changes place, so typing isn't interrupted.
        if (moved && page === 'posts') render();
        else { msg.textContent = 'Saved'; setTimeout(function () { msg.textContent = ''; }, 1800); }
      })
      .catch(function () { msg.textContent = 'Not saved. Try again in a moment.'; });
  }

  function postCard(p) {
    var g = groupOf(p);
    var locked = g === 'scheduled' || g === 'posted';
    var msg = el('span', { class: 'sub small', role: 'status' });

    var cap = el('textarea', { disabled: locked });
    cap.value = p.caption || '';
    var chars = el('span', { class: 'sub small', text: cap.value.length + ' / 2,200 characters' });
    cap.addEventListener('input', function () { chars.textContent = cap.value.length + ' / 2,200 characters'; });
    cap.addEventListener('change', function () { if (cap.value !== (p.caption || '')) savePost(p.id, { caption: cap.value }, msg); });

    var when = el('input', { type: 'datetime-local', disabled: locked });
    when.value = p.when || '';
    when.addEventListener('change', function () { if (when.value !== (p.when || '')) savePost(p.id, { when: when.value }, msg); });

    var actions = el('div', { class: 'actions' });
    var noteBox = null;
    if (g === 'review') {
      var note = el('textarea', { placeholder: 'What should change?' });
      note.value = p.note || '';
      noteBox = el('div', { class: p.status === 'changes' ? '' : 'hide' },
        el('label', { class: 'f' }, document.createTextNode('Changes for Claude'), note),
        el('div', { class: 'actions', style: 'margin-top:8px' },
          el('button', { type: 'button', class: 'btn', text: 'Send changes', onclick: function () { savePost(p.id, { status: 'changes', note: note.value }, msg); } })));
      actions.append(
        el('button', { type: 'button', class: 'btn primary', text: 'Approve', onclick: function () { savePost(p.id, { status: 'approved', caption: cap.value, when: when.value }, msg); } }),
        el('button', { type: 'button', class: 'btn', text: 'Request changes', onclick: function () { noteBox.classList.remove('hide'); note.focus(); } }),
        msg);
    } else if (g === 'approved') {
      actions.append(el('button', { type: 'button', class: 'btn', text: 'Move back to review', onclick: function () { savePost(p.id, { status: 'review' }, msg); } }), msg);
    }

    var state = STATE[p.status] || STATE.review;
    return el('article', { class: 'post', id: 'post-' + p.id },
      el('img', { src: p.image || '', alt: p.alt || p.name || 'Post image', loading: 'lazy' }),
      el('div', { class: 'pbody' },
        el('div', { class: 'prow' },
          el('span', { class: 'name', text: p.name || 'Post' }),
          el('span', { class: 'state' }, el('span', { class: 'badge ' + state[1], text: state[0] }), el('span', { class: 'sub', text: whenText(p.when) }))),
        el('label', { class: 'f' }, document.createTextNode('Goes out (Singapore time)'), when),
        el('div', {}, el('label', { class: 'f' }, document.createTextNode('Caption'), cap), chars),
        p.note ? el('p', { class: 'sub', text: (p.status === 'changes' ? 'Changes requested: ' : 'Note: ') + p.note }) : null,
        noteBox,
        actions.childNodes.length ? actions : null));
  }

  function renderPosts(d, view) {
    alerts([]);
    var posts = d.posts || [];
    var by = { review: [], approved: [], scheduled: [], posted: [] };
    posts.forEach(function (p) { by[groupOf(p)].push(p); });
    // Soonest first; posts with no date go last.
    var order = function (a, b) { var x = a.when || '~', y = b.when || '~'; return x < y ? -1 : x > y ? 1 : 0; };
    Object.keys(by).forEach(function (k) { by[k].sort(order); });
    by.posted.reverse();

    var showReview = read('larkin-dash-grid-review') !== '0';
    var box = el('input', { type: 'checkbox' });
    box.checked = showReview;
    box.addEventListener('change', function () { write('larkin-dash-grid-review', box.checked ? '1' : '0'); render(); });
    var shown = posts.filter(function (p) { return p.when && p.image && p.status !== 'changes' && (showReview || groupOf(p) !== 'review'); })
      .sort(function (a, b) { return order(b, a); });
    var grid = el('div', { class: 'ig' }, shown.map(function (p) {
      var pending = groupOf(p) === 'review';
      var kids = [el('img', { src: p.image, alt: p.alt || p.name || '', loading: 'lazy' }),
        el('span', { class: 'd', text: p.status === 'posted' ? 'Posted' : niceDate(p.when.split('T')[0]) })];
      if (p.status === 'posted') return el('div', { title: p.name }, kids);
      return el('button', { type: 'button', class: pending ? 'pending' : '', 'aria-label': 'Go to ' + p.name, title: p.name,
        onclick: function () { var t = $('post-' + p.id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, kids);
    }));

    var counts = el('div', { class: 'cards' },
      [['To review', by.review.length], ['Approved', by.approved.length], ['Scheduled', by.scheduled.length], ['Posted', by.posted.length]].map(function (c) {
        return el('div', { class: 'card' }, el('span', { class: 'l', text: c[0] }), el('span', { class: 'n', text: String(c[1]) }));
      }));
    var nodes = [
      counts,
      el('div', { class: 'sec' },
        el('div', { class: 'sechead' }, el('h2', { text: 'Grid preview' }), el('label', { class: 'toggle' }, box, document.createTextNode('Include posts to review'))),
        el('p', { class: 'sub', text: 'How @getlarkin will look as posts go out, newest first. Faded posts aren’t approved yet.' }),
        shown.length ? grid : el('p', { class: 'sub', text: 'No posts with a date yet.' }))
    ];
    GROUPS.forEach(function (g) {
      nodes.push(el('div', { class: 'sec' }, el('h2', { text: g[1] }),
        by[g[0]].length ? by[g[0]].map(postCard) : [el('p', { class: 'sub', text: g[2] })]));
    });
    nodes.push(el('p', { class: 'sub small', text: 'Claude schedules approved posts in Meta Business Suite.' }));
    view.replaceChildren.apply(view, nodes);
  }

  /* ---------- Emails ---------- */

  function openMail(m, edit) {
    var dlg = $('mail');
    var time = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    var body = el('div', { class: 'body' });
    // The text is plain; web addresses are underlined as the mail app shows them.
    String(m.body || '').split(/(https?:\/\/\S+)/).forEach(function (part, i) {
      body.appendChild(i % 2 ? el('u', { text: part }) : document.createTextNode(part));
    });
    var close = el('button', { type: 'button', class: 'x', 'aria-label': 'Close', onclick: function () { dlg.close(); } });
    close.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.500 1.500l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></svg>';
    dlg.replaceChildren(el('div', { class: 'modal' },
      el('header', {}, el('b', { text: 'Email preview' }), close),
      el('div', { class: 'mail' },
        el('div', { class: 'inbox' },
          el('b', { text: m.fromName }),
          el('span', { class: 'line' }, el('b', { text: m.subject }), document.createTextNode(' - ' + m.preview)),
          el('span', { class: 'time', text: time })),
        el('div', { class: 'letter' },
          el('p', { class: 'subject', text: m.subject }),
          el('div', { class: 'from' },
            el('div', { class: 'av', text: (m.fromName || '?').slice(0, 1) }),
            el('div', { class: 'who' }, el('b', { text: m.fromName }), el('span', { text: ' <' + m.fromAddress + '>' }), el('br'), el('span', { text: 'to me' })),
            el('span', { class: 'time', text: time })),
          body,
          el('p', { class: 'footer', text: m.footer }))),
      el('footer', {},
        edit ? el('a', { class: 'btn', href: edit.url, target: '_blank', rel: 'noopener', text: edit.label }) : null,
        el('button', { type: 'button', class: 'btn primary', text: 'Done', onclick: function () { dlg.close(); } }))));
    if (!dlg.open) dlg.showModal();
  }

  function renderEmails(d, view) {
    alerts([]);
    var flows = (d.flows || []).map(function (f) {
      var edit = f.edit && /^https:\/\/app\.loops\.so\//.test(f.edit.url) ? f.edit : null;
      return el('div', { class: 'card flow' },
        el('h3', { text: f.name }),
        el('p', { class: 'count', text: f.people == null ? '–' : plural(f.people, 'person', 'people') }),
        el('p', { class: 'sub', text: f.audience }),
        el('ol', { class: 'steps' }, f.steps.map(function (s) {
          return el('li', { class: s.email ? 'mailstep' : '' }, el('p', { text: s.title }), s.detail ? el('p', { class: 'sub', text: s.detail }) : null,
            s.email ? el('button', { type: 'button', class: 'btn', text: 'Read the email', onclick: function () { openMail(s.email, edit); } }) : null);
        })),
        el('div', { class: 'foot' }, el('span', { class: 'sub', text: f.stats || '' }),
          edit ? el('a', { class: 'link', href: edit.url, target: '_blank', rel: 'noopener', text: edit.label + ' →' }) : null));
    });
    view.replaceChildren(el('div', { class: 'flows' }, flows),
      el('p', { class: 'sub small', text: 'People counts are live. Steps and email numbers were checked in Loops on ' + niceDate(d.checked) + '. Emails are edited in Loops.' }));
  }

  /* ---------- wiring ---------- */

  function go(id, fromHash) {
    if (!PAGES.some(function (p) { return p.id === id; })) id = 'ads';
    page = id;
    if (!fromHash && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    render(true);
    load(current().part, false);
    window.scrollTo(0, 0);
  }

  ['nav', 'tabs'].forEach(function (id) {
    PAGES.forEach(function (p) {
      var b = el('button', { type: 'button', 'data-page': p.id, onclick: function () { go(p.id); } });
      b.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">' + p.icon + '</svg><span>' + esc(p.name) + '</span>';
      $(id).appendChild(b);
    });
  });
  PERIODS.forEach(function (p) {
    $('switch').appendChild(el('button', { type: 'button', 'data-period': p[0], text: p[1], onclick: function () {
      period = p[0]; write('larkin-dash-period', period); render(true);
    } }));
  });
  $('refresh').addEventListener('click', function () { load(current().part, true); });
  var lastW = 0;
  window.addEventListener('resize', function () {
    var host = $('chart');
    if (host && redraw && host.clientWidth !== lastW) { lastW = host.clientWidth; redraw(); }
  });
  window.addEventListener('hashchange', function () { go(location.hash.slice(1), true); });
  $('mail').addEventListener('click', function (e) { if (e.target === $('mail')) $('mail').close(); });
  $('lock-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim();
    if (!code) return;
    write(KEY, code);
    $('lock-msg').textContent = 'Checking…';
    load(current().part, true);
  });
  // Coming back to the page (or the home-screen app) fetches fresh numbers.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load(current().part, false);
  });

  page = PAGES.some(function (p) { return p.id === location.hash.slice(1); }) ? location.hash.slice(1) : 'ads';
  if (read(KEY)) { $('shell').classList.remove('hide'); load(current().part, true); }
  else showLock();
})();
</script>
</body>
</html>
