<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Larkin</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larkin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Larkin's private dashboard. Dark, like the app: page #0B0B0B, tiles #1C1C1C,
   one text size with white and grey for hierarchy, lime as the one accent. */
@font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/fonts/dm-sans-latin.woff2") format("woff2"); }
:root {
  --page: #0B0B0B;
  --tile: #1C1C1C;
  --control: #333333;
  --ink: #FFFFFF;
  --grey: #A3A39D;
  --line: rgba(255,255,255,.12);
  --lime: #D2ED28;
  --on-lime: #151515;
  --side: 232px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--page); }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 16px; line-height: 21px; font-weight: 450; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1 { font-size: 28px; line-height: 32px; letter-spacing: -0.015em; font-weight: 600; margin: 0; }
h2 { font-size: 16px; line-height: 21px; font-weight: 600; margin: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
.grey { color: var(--grey); }
.hide { display: none !important; }
button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.logo { --h: 22px; display: block; height: var(--h); width: calc(var(--h) * 3.342); fill: var(--ink); }

/* Layout: a sidebar on a laptop, a bottom bar on a phone. */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side); padding: 28px 16px;
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 28px;
}
.side .logo { margin-left: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { text-align: left; min-height: 44px; padding: 0 12px; border-radius: 14px; color: var(--grey); font-weight: 500; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--tile); color: var(--ink); }
.main { margin-left: var(--side); padding: 32px 40px 64px; }
.inner { max-width: 1040px; display: flex; flex-direction: column; gap: 24px; }
.tabs { display: none; }
.phone-logo { display: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.top p { margin-top: 6px; }
.pill { min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--lime); color: var(--on-lime); font-weight: 600; white-space: nowrap; }
.pill[disabled] { opacity: .55; cursor: default; }
.pill.quiet { background: var(--control); color: var(--ink); }

.switch { display: flex; gap: 4px; background: var(--tile); border-radius: 999px; padding: 4px; width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.switch::-webkit-scrollbar { display: none; }
.switch button { min-height: 40px; padding: 0 18px; border-radius: 999px; font-weight: 600; color: var(--grey); white-space: nowrap; flex: none; }
.switch button[aria-pressed="true"] { background: var(--lime); color: var(--on-lime); }
.range { margin-top: -12px; }

.tile { background: var(--tile); border-radius: 28px; padding: 20px; min-width: 0; }
.tile > h2 { margin-bottom: 14px; }
.alerts p + p { margin-top: 6px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stat .n { display: block; font-size: 34px; line-height: 38px; letter-spacing: -0.015em; font-weight: 600; margin: 10px 0 6px; white-space: nowrap; }
.funnel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.funnel .n { display: block; font-size: 22px; line-height: 26px; font-weight: 600; margin-bottom: 2px; }

.section { display: flex; flex-direction: column; gap: 14px; }
.ads { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
.ad { background: var(--tile); border-radius: 28px; overflow: hidden; }
.ad .pic { display: block; position: relative; aspect-ratio: 9 / 16; background: var(--control); }
.ad .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad .tag { position: absolute; left: 12px; top: 12px; background: #FFFFFF; color: #151515; border-radius: 999px; padding: 3px 12px; font-size: 13px; line-height: 18px; font-weight: 600; }
.ad .txt { padding: 16px 16px 18px; }
.ad .name { font-weight: 600; margin-bottom: 8px; text-wrap: balance; }
.ad .txt p b { font-weight: 600; color: var(--ink); }

.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: inherit; font-size: 13px; fill: var(--grey); letter-spacing: 0; }
.chart text.r { fill: var(--ink); font-weight: 600; }

/* Posts */
.ig { max-width: 470px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.ig button, .ig div { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--control); display: block; }
.ig img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig .pending img { opacity: .5; }
.ig .d { position: absolute; left: 6px; bottom: 6px; background: #FFFFFF; color: #151515; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; padding: 2px 8px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--grey); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--lime); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.post { background: var(--tile); border-radius: 28px; padding: 16px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; scroll-margin-top: 16px; }
.post > img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 16px; display: block; background: var(--control); }
.pbody { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 4px 4px 4px 0; }
.prow { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.prow .name { font-weight: 600; }
.lime { color: var(--lime); }
label.f { display: block; color: var(--grey); }
label.f > textarea, label.f > input { margin-top: 6px; }
textarea, input[type="datetime-local"], input[type="password"] {
  width: 100%; background: var(--page); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink);
}
textarea { min-height: 100px; resize: vertical; display: block; }
input[type="datetime-local"] { max-width: 260px; display: block; }
textarea:disabled, input:disabled { opacity: .7; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.empty { color: var(--grey); }

/* Emails */
.flows { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.flow .count { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; margin: 10px 0 2px; }
.steps { list-style: none; margin: 18px 0 0; padding: 0; counter-reset: step; }
.steps li { counter-increment: step; padding: 14px 0 14px 32px; border-top: 1px solid var(--line); position: relative; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: 14px; color: var(--grey); }
.steps details { margin-top: 8px; }
.steps summary { cursor: pointer; color: var(--ink); font-weight: 600; width: max-content; }
.steps .mail { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--grey); }
.steps .mail b { color: var(--ink); font-weight: 600; }
.flow .foot { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
a.pill { display: inline-flex; align-items: center; text-decoration: none; }

/* Lock */
.lock { max-width: 360px; margin: 0 auto; padding: 18vh 16px 0; }
.lock .logo { --h: 28px; margin-bottom: 28px; }
.lock form { display: flex; gap: 8px; margin-top: 20px; }
.lock input { flex: 1; min-width: 0; min-height: 48px; border-radius: 999px; padding: 0 18px; }
.msg { min-height: 21px; margin-top: 10px; }

@media (max-width: 1100px) {
  .ads { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .side { display: none; }
  .main { margin-left: 0; padding: calc(20px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  .phone-logo { display: block; }
  .phone-logo .logo { --h: 20px; }
  .tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0 0; z-index: 5;
    background: var(--page); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs button { min-height: 48px; border-radius: 14px; color: var(--grey); font-weight: 500; font-size: 15px; }
  .tabs button[aria-current="page"] { color: var(--ink); background: var(--tile); }
  .grid, .grid.c4, .grid.c5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.money .stat:last-child, .grid.c5 .stat:last-child { grid-column: 1 / -1; }
  .stat .n { font-size: 28px; line-height: 32px; }
  .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ads { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ad, .tile, .post { border-radius: 24px; }
  .ad .txt { padding: 14px 14px 16px; }
  .post { grid-template-columns: minmax(0, 1fr); }
  .pbody { padding: 0 4px 4px; }
  .flows { grid-template-columns: minmax(0, 1fr); }
  .switch { width: 100%; }
  .switch button { padding: 0 4px; flex: 1 1 auto; font-size: 15px; }
}
</style>
</head>
<body>

<section class="lock hide" id="lock">
  <svg class="logo" viewBox="0 0 431.8 129.2" role="img" aria-label="Larkin"><use href="#wordmark"/></svg>
  <p class="grey">Enter the passcode to open the dashboard.</p>
  <form id="lock-form">
    <input id="code" type="password" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode">
    <button class="pill" type="submit">Open</button>
  </form>
  <p class="msg grey" id="lock-msg" role="status"></p>
</section>

<div id="shell" class="hide">
  <aside class="side">
    <svg class="logo" viewBox="0 0 431.8 129.2" role="img" aria-label="Larkin"><use href="#wordmark"/></svg>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main">
    <div class="inner">
      <div class="phone-logo"><svg class="logo" viewBox="0 0 431.8 129.2" role="img" aria-label="Larkin"><use href="#wordmark"/></svg></div>
      <div class="top">
        <div>
          <h1 id="title">Ads</h1>
          <p class="grey" id="updated">Loading…</p>
        </div>
        <button class="pill" id="refresh" type="button">Refresh</button>
      </div>
      <div class="tile alerts hide" id="alerts"></div>
      <div class="switch" id="switch" role="group" aria-label="Period"></div>
      <p class="grey range" id="range"></p>
      <div class="inner" id="view"></div>
    </div>
  </main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

</svg>

<script>
(function () {
  'use strict';
  var API = 'https://jvdtgnwexspohnsbxpbl.supabase.co/functions/v1/dash';
  var KEY = 'larkin-dash-code';
  var PAGES = [
    { id: 'ads', name: 'Ads', part: 'ads', periods: true },
    { id: 'posts', name: 'Posts', part: 'posts' },
    { id: 'website', name: 'Website', part: 'site', periods: true },
    { id: 'app', name: 'App', part: 'site', periods: true },
    { id: 'emails', name: 'Emails', part: 'emails' }
  ];
  var PERIODS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7d', '7 days'], ['14d', '14 days'], ['30d', '30 days']];
  var cache = {};      // part → latest answer
  var loading = {};    // part → true while a request is out
  var failed = {};     // part → true when the last request failed
  var page = 'ads';
  var period = read('larkin-dash-period') || 'today';
  if (!PERIODS.some(function (p) { return p[0] === period; })) period = 'today';

  function $(id) { return document.getElementById(id); }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(n) {
    if (n == null) return '–';
    var text = '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return n < 0 ? '−' + text : text;
  }
  function times(n) { return n == null ? null : n.toFixed(2) + '×'; }
  function num(n) { return n == null ? '–' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  function plural(n, one, many) { return num(n) + ' ' + (n === 1 ? one : many); }
  function niceDate(iso) {
    var p = iso.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  function current() { return PAGES.filter(function (p) { return p.id === page; })[0]; }
  function pick(list) { return (list || []).filter(function (p) { return p.key === period; })[0] || null; }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) {
      var v = attrs[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (Array.isArray(kid)) kid.forEach(function (c) { if (c) n.appendChild(c); });
      else if (kid) n.appendChild(kid);
    }
    return n;
  }

  /* ---------- loading ---------- */

  function showLock(message) {
    $('shell').classList.add('hide');
    $('lock').classList.remove('hide');
    $('lock-msg').textContent = message || '';
    $('code').focus();
  }

  function load(part, force) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    if (loading[part]) return;
    var have = cache[part];
    if (have && !force && Date.now() - new Date(have.updatedAt).getTime() < 60000) return;
    loading[part] = true;
    frame();
    fetch(API + '?part=' + part, { headers: { 'x-dashboard-key': code }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { write(KEY, null); showLock('That passcode didn’t work.'); throw null; }
        if (!r.ok) throw new Error('status ' + r.status);
        return r.json();
      })
      .then(function (json) {
        cache[part] = json;
        failed[part] = false;
        $('lock').classList.add('hide');
        $('shell').classList.remove('hide');
      })
      .catch(function (err) { if (err !== null) failed[part] = true; })
      .then(function () {
        loading[part] = false;
        if ($('shell').classList.contains('hide')) return;
        if (current().part === part) render(); else frame();
      });
  }

  /* ---------- page frame ---------- */

  function frame() {
    var p = current(), d = cache[p.part];
    $('title').textContent = p.name;
    document.title = p.name + ' · Larkin';
    ['nav', 'tabs'].forEach(function (id) {
      Array.prototype.forEach.call($(id).children, function (b) {
        if (b.getAttribute('data-page') === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
    });
    $('switch').classList.toggle('hide', !p.periods);
    Array.prototype.forEach.call($('switch').children, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-period') === period));
    });
    var busy = !!loading[p.part];
    $('refresh').disabled = busy;
    $('refresh').textContent = busy ? 'Refreshing…' : 'Refresh';
    if (d) {
      $('updated').textContent = (failed[p.part] ? 'Couldn’t refresh. Showing ' : 'Updated ') +
        new Date(d.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
        (p.periods ? ' · days follow ' + String(d.timeZone || '').replace(/^.*\//, '').replace(/_/g, ' ') + ' time' : '');
    } else {
      $('updated').textContent = failed[p.part] ? 'Couldn’t load this page. Try Refresh in a moment.' : 'Loading…';
    }
  }

  function render() {
    frame();
    var p = current(), d = cache[p.part], view = $('view');
    $('alerts').classList.add('hide');
    $('range').classList.add('hide');
    drawChart = null;
    if (!d) { view.replaceChildren(); return; }
    if (p.periods) {
      var w = pick(d.periods);
      if (w) {
        $('range').textContent = w.from === w.to ? niceDate(w.from) : niceDate(w.from) + ' to ' + niceDate(w.to);
        $('range').classList.remove('hide');
      }
    }
    if (page === 'ads') renderAds(d, view);
    else if (page === 'website') renderSite(d, view, false);
    else if (page === 'app') renderSite(d, view, true);
    else if (page === 'posts') renderPosts(d, view);
    else renderEmails(d, view);
  }

  function alerts(notes) {
    $('alerts').innerHTML = notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join('');
    $('alerts').classList.toggle('hide', notes.length === 0);
  }
  function stat(label, value, detail) {
    return '<div class="tile stat"><span class="grey">' + esc(label) + '</span><span class="n">' + esc(value) + '</span>' +
      (detail ? '<span class="grey">' + esc(detail) + '</span>' : '') + '</div>';
  }

  /* ---------- Ads ---------- */

  function renderAds(d, view) {
    var notes = (d.warnings || []).slice();
    if (d.sources.meta !== 'ok') notes.push(d.sources.meta === 'not_connected' ? 'Meta isn’t connected, so ad numbers are missing.' : 'Meta didn’t answer: ' + d.sources.meta);
    if (d.sources.stripe !== 'ok') notes.push(d.sources.stripe === 'not_connected' ? 'Stripe isn’t connected, so reservations are missing.' : 'Stripe didn’t answer: ' + d.sources.stripe);
    alerts(notes);

    var w = pick(d.periods);
    if (!w) { view.replaceChildren(); return; }
    var back = times(w.realReturn);
    var spendLine = period === 'today' && d.budget ? 'of ' + money(d.budget) + ' budget' : (w.costPerReservation != null ? money(w.costPerReservation) + ' per reservation' : '');
    var revenueLine = plural(w.reservations, 'reservation', 'reservations') + (w.refunded ? ', ' + money(w.refunded) + ' refunded' : '');
    var html = '<div class="grid money">' +
      stat('Ad spend', money(w.spend), spendLine) +
      stat('Revenue', money(w.net), revenueLine) +
      stat('Profit', money(w.profit), back ? back + ' back on ad spend' : 'No ad spend') +
      '</div>';

    var m = w.meta;
    if (m) {
      var steps = [[m.linkClicks, 'clicked the ad'], [m.landingViews, 'reached the site'], [m.checkouts, 'clicked Reserve'], [m.purchases, 'paid']];
      html += '<div class="tile"><h2>From ad to reservation</h2><div class="funnel">' + steps.map(function (s, i) {
        var prev = i ? steps[i - 1][0] : null;
        var rate = prev ? ' (' + Math.round(100 * s[0] / prev) + '%)' : '';
        return '<div><span class="n">' + esc(num(s[0])) + '</span><span class="grey">' + esc(s[1] + rate) + '</span></div>';
      }).join('') + '</div></div>';
    }

    var info = {};
    (d.ads || []).forEach(function (a) { info[a.id] = a; });
    var safe = function (u) { return u && /^https:\/\//.test(u) ? u : null; };
    var structure = (d.campaigns || []).map(function (c) {
      return 'Campaign: ' + c.name + ' · ' + c.status + (c.dailyBudget ? ' · ' + money(c.dailyBudget) + ' a day' : '');
    }).concat((d.adsets || []).map(function (a) { return 'Ad set: ' + a.name + ' · ' + a.status; }));
    html += '<div class="section"><h2>Ads</h2>' + structure.map(function (s) { return '<p class="grey">' + esc(s) + '</p>'; }).join('') + '</div>';
    html += '<div class="ads">' + (w.ads || []).map(function (n) {
      var a = info[n.id] || { name: 'Ad', status: '' };
      var pic = safe(a.picture), link = safe(a.link);
      var img = (pic ? '<img src="' + esc(pic) + '" alt="' + esc(a.name) + '" loading="lazy" referrerpolicy="no-referrer">' : '') +
        (a.video ? '<span class="tag">Video</span>' : '');
      var lines = ['<b>' + esc(money(n.spend)) + '</b> spent', '<b>' + esc(num(n.purchases)) + '</b> ' + (n.purchases === 1 ? 'reservation' : 'reservations')];
      if (n.costPerPurchase != null) lines.push('<b>' + esc(money(n.costPerPurchase)) + '</b> each');
      lines.push('<b>' + esc(num(n.linkClicks)) + '</b> ' + (n.linkClicks === 1 ? 'click' : 'clicks'));
      if (a.status && a.status !== 'Active') lines.push(esc(a.status));
      return '<article class="ad">' +
        (link ? '<a class="pic" href="' + esc(link) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(a.name) + '">' + img + '</a>' : '<div class="pic">' + img + '</div>') +
        '<div class="txt"><p class="name">' + esc(a.name) + '</p>' + lines.map(function (l) { return '<p class="grey">' + l + '</p>'; }).join('') + '</div></article>';
    }).join('') + '</div>';

    html += '<div class="tile chart"><h2>Last 30 days</h2><p class="grey" style="margin:-8px 0 14px">Bars are ad spend. The numbers above are reservations.</p><div id="chart"></div></div>';
    view.innerHTML = html;
    drawChart = function () {
      chart($('chart'), d.daily || [], function (r) { return r.spend; }, function (r) { return r.reservations || ''; },
        function (r) { return niceDate(r.date) + ': ' + money(r.spend) + ', ' + plural(r.reservations, 'reservation', 'reservations'); }, w);
    };
    drawChart();
  }

  /* ---------- Website and App ---------- */

  function renderSite(d, view, app) {
    if (d.source !== 'ok') {
      alerts([d.source === 'not_connected' ? 'PostHog isn’t connected, so these numbers are missing.' : 'PostHog didn’t answer: ' + d.source]);
      view.replaceChildren();
      return;
    }
    alerts([]);
    var w = pick(d.periods);
    if (!w) { view.replaceChildren(); return; }
    var share = function (n) { return w.visitors ? Math.round(100 * n / w.visitors) + '% of visitors' : ''; };
    var tiles = app ? [
      stat('App installs', num(w.installs)),
      stat('Active app users', num(w.activeUsers)),
      stat('Users transcribing', num(w.transcribers)),
      stat('Minutes transcribed', num(w.minutes)),
      stat('Transcription cost', money(w.cost))
    ] : [
      stat('Website visitors', num(w.visitors)),
      stat('Reserve clicks', num(w.reserveClicks), share(w.reserveClicks)),
      stat('Beta signups', num(w.betaSignups), share(w.betaSignups)),
      stat('Reservations paid', num(w.reservationsPaid), share(w.reservationsPaid))
    ];
    view.innerHTML = '<div class="grid c' + tiles.length + '">' + tiles.join('') + '</div>' +
      '<div class="tile chart"><h2>' + (app ? 'Active app users per day' : 'Website visitors per day') + '</h2><div id="chart"></div></div>' +
      '<p class="grey">The same counts as the Morning dashboard in PostHog, on whole days.</p>';
    var get = app ? function (r) { return r.activeUsers; } : function (r) { return r.visitors; };
    drawChart = function () {
      chart($('chart'), d.daily || [], get, function (r, wide) { return wide ? num(get(r)) : ''; },
        function (r) { return niceDate(r.date) + ': ' + plural(get(r), app ? 'active user' : 'visitor', app ? 'active users' : 'visitors'); }, w);
    };
    drawChart();
  }

  /* ---------- 30-day bar chart; the chosen period's days are lime ---------- */

  var drawChart = null;
  function chart(host, rows, value, above, tip, w) {
    if (!host) return;
    var W = Math.max(280, Math.round(host.clientWidth || 600)), H = 180, top = 24, bottom = 26, gap = W < 500 ? 2 : 4;
    var max = Math.max.apply(null, rows.map(value).concat([1]));
    var bw = (W - gap * (rows.length - 1)) / rows.length;
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Per day, last 30 days">';
    rows.forEach(function (r, i) {
      var v = value(r), x = i * (bw + gap);
      var h = Math.max(v > 0 ? 2 : 0, (H - top - bottom) * v / max);
      var y = H - bottom - h;
      var on = w && r.date >= w.from && r.date <= w.to;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(3, bw / 2).toFixed(1) +
        '" fill="' + (on ? 'var(--lime)' : '#4A4A4A') + '"><title>' + esc(tip(r)) + '</title></rect>';
      var label = above(r, bw >= 18);
      if (label !== '') out += '<text class="r" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + esc(label) + '</text>';
    });
    if (rows.length) {
      out += '<text x="0" y="' + (H - 5) + '">' + esc(niceDate(rows[0].date)) + '</text>';
      out += '<text x="' + W + '" y="' + (H - 5) + '" text-anchor="end">' + esc(niceDate(rows[rows.length - 1].date)) + '</text>';
    }
    host.innerHTML = out + '</svg>';
  }

  /* ---------- Posts ---------- */

  var STATE = { suggested: 'To review', review: 'To review', changes: 'Changes asked', approved: 'Approved', scheduled: 'Scheduled', posted: 'Posted' };
  var GROUPS = [
    ['review', 'To review', 'Nothing to review. New post ideas will appear here.'],
    ['approved', 'Approved, waiting to be scheduled', 'No approved posts waiting.'],
    ['scheduled', 'Scheduled on Instagram', 'Nothing scheduled yet.'],
    ['posted', 'Posted', 'Nothing posted yet.']
  ];
  function groupOf(p) { return p.status === 'approved' || p.status === 'scheduled' || p.status === 'posted' ? p.status : 'review'; }
  function whenText(v) {
    if (!v) return 'No date yet';
    var parts = v.split('T');
    var day = new Date(parts[0] + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return day + ' · ' + (parts[1] || '').slice(0, 5);
  }

  function savePost(id, patch, msg) {
    var code = read(KEY);
    if (!code) { showLock(); return; }
    msg.textContent = 'Saving…';
    patch.id = id;
    fetch(API + '?part=posts', { method: 'POST', headers: { 'x-dashboard-key': code, 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (json) {
        var d = cache.posts, moved = false;
        d.posts = d.posts.map(function (p) {
          if (p.id !== id) return p;
          moved = p.status !== json.post.status || p.when !== json.post.when;
          return json.post;
        });
        // Only redraw when the post changes place, so typing isn't interrupted.
        if (moved && page === 'posts') render();
        else { msg.textContent = 'Saved'; setTimeout(function () { msg.textContent = ''; }, 1800); }
      })
      .catch(function () { msg.textContent = 'Not saved. Try again in a moment.'; });
  }

  function postCard(p) {
    var g = groupOf(p);
    var locked = g === 'scheduled' || g === 'posted';
    var msg = el('span', { class: 'grey', role: 'status' });

    var cap = el('textarea', { disabled: locked });
    cap.value = p.caption || '';
    var chars = el('span', { class: 'grey', text: cap.value.length + ' / 2,200 characters' });
    cap.addEventListener('input', function () { chars.textContent = cap.value.length + ' / 2,200 characters'; });
    cap.addEventListener('change', function () { if (cap.value !== (p.caption || '')) savePost(p.id, { caption: cap.value }, msg); });

    var when = el('input', { type: 'datetime-local', disabled: locked });
    when.value = p.when || '';
    when.addEventListener('change', function () { if (when.value !== (p.when || '')) savePost(p.id, { when: when.value }, msg); });

    var actions = el('div', { class: 'actions' });
    var noteBox = null;
    if (g === 'review') {
      var note = el('textarea', { placeholder: 'What should change?' });
      note.value = p.note || '';
      noteBox = el('div', { class: p.status === 'changes' ? '' : 'hide' },
        el('label', { class: 'f' }, document.createTextNode('Changes for Claude'), note),
        el('div', { class: 'actions', style: 'margin-top:10px' },
          el('button', { type: 'button', class: 'pill quiet', text: 'Send changes', onclick: function () { savePost(p.id, { status: 'changes', note: note.value }, msg); } })));
      actions.append(
        el('button', { type: 'button', class: 'pill', text: 'Approve', onclick: function () { savePost(p.id, { status: 'approved', caption: cap.value, when: when.value }, msg); } }),
        el('button', { type: 'button', class: 'pill quiet', text: 'Ask for changes', onclick: function () { noteBox.classList.remove('hide'); note.focus(); } }),
        msg);
    } else if (g === 'approved') {
      actions.append(el('button', { type: 'button', class: 'pill quiet', text: 'Move back to review', onclick: function () { savePost(p.id, { status: 'review' }, msg); } }), msg);
    }

    return el('article', { class: 'post', id: 'post-' + p.id },
      el('img', { src: p.image || '', alt: p.alt || p.name || 'Post image', loading: 'lazy' }),
      el('div', { class: 'pbody' },
        el('div', { class: 'prow' },
          el('span', { class: 'name', text: p.name || 'Post' }),
          el('span', { class: p.status === 'approved' ? 'lime' : 'grey', text: (STATE[p.status] || 'To review') + ' · ' + whenText(p.when) })),
        el('label', { class: 'f' }, document.createTextNode('Goes out, Singapore time'), when),
        el('div', {}, el('label', { class: 'f' }, document.createTextNode('Caption'), cap), chars),
        p.note ? el('p', { class: 'grey', text: (p.status === 'changes' ? 'Changes asked: ' : 'Note: ') + p.note }) : null,
        noteBox,
        actions.childNodes.length ? actions : null));
  }

  function renderPosts(d, view) {
    alerts([]);
    var posts = d.posts || [];
    var by = { review: [], approved: [], scheduled: [], posted: [] };
    posts.forEach(function (p) { by[groupOf(p)].push(p); });
    // Soonest first; posts with no date go last.
    var order = function (a, b) { var x = a.when || '~', y = b.when || '~'; return x < y ? -1 : x > y ? 1 : 0; };
    Object.keys(by).forEach(function (k) { by[k].sort(order); });
    by.posted.reverse();

    var showReview = read('larkin-dash-grid-review') !== '0';
    var box = el('input', { type: 'checkbox' });
    box.checked = showReview;
    box.addEventListener('change', function () { write('larkin-dash-grid-review', box.checked ? '1' : '0'); render(); });
    var shown = posts.filter(function (p) { return p.when && p.image && p.status !== 'changes' && (showReview || groupOf(p) !== 'review'); })
      .sort(function (a, b) { return order(b, a); });
    var grid = el('div', { class: 'ig' }, shown.map(function (p) {
      var pending = groupOf(p) === 'review';
      var kids = [el('img', { src: p.image, alt: p.alt || p.name || '', loading: 'lazy' }),
        el('span', { class: 'd', text: p.status === 'posted' ? 'Posted' : niceDate(p.when.split('T')[0]) })];
      if (p.status === 'posted') return el('div', { title: p.name }, kids);
      return el('button', { type: 'button', class: pending ? 'pending' : '', 'aria-label': 'Go to ' + p.name, title: p.name,
        onclick: function () { var t = $('post-' + p.id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, kids);
    }));

    var nodes = [
      el('p', { class: 'grey', text: plural(by.review.length, 'post', 'posts') + ' to review, ' + by.approved.length + ' approved, ' + by.scheduled.length + ' scheduled, ' + by.posted.length + ' posted. Claude schedules approved posts in Meta Business Suite.' }),
      el('div', { class: 'section' },
        el('div', { class: 'bar' }, el('h2', { text: 'Grid preview' }), el('label', { class: 'toggle' }, box, document.createTextNode('Include posts to review'))),
        el('p', { class: 'grey', text: 'How @getlarkin will look as posts go out, newest first. Faded posts aren’t approved yet.' }),
        shown.length ? grid : el('p', { class: 'empty', text: 'No posts with a date yet.' }))
    ];
    GROUPS.forEach(function (g) {
      nodes.push(el('div', { class: 'section' }, el('h2', { text: g[1] }),
        by[g[0]].length ? by[g[0]].map(postCard) : [el('p', { class: 'empty', text: g[2] })]));
    });
    view.replaceChildren.apply(view, nodes);
  }

  /* ---------- Emails ---------- */

  function renderEmails(d, view) {
    alerts([]);
    view.innerHTML = '<div class="flows">' + (d.flows || []).map(function (f) {
      var safe = f.edit && /^https:\/\/app\.loops\.so\//.test(f.edit.url);
      return '<div class="tile flow"><h2 style="margin:0">' + esc(f.name) + '</h2>' +
        '<p class="count">' + esc(f.people == null ? '–' : plural(f.people, 'person', 'people')) + '</p>' +
        '<p class="grey">' + esc(f.audience) + '</p>' +
        '<ol class="steps">' + f.steps.map(function (s) {
          return '<li><p>' + esc(s.title) + '</p>' + (s.detail ? '<p class="grey">' + esc(s.detail) + '</p>' : '') +
            (s.email ? '<details><summary>Read the email</summary><p class="mail"><b>' + esc(s.email.subject) + '</b>\n\n' + esc(s.email.body) + '</p></details>' : '') + '</li>';
        }).join('') + '</ol>' +
        '<div class="foot">' + (f.stats ? '<p class="grey">' + esc(f.stats) + '</p>' : '') +
        (safe ? '<a class="pill quiet" href="' + esc(f.edit.url) + '" target="_blank" rel="noopener">' + esc(f.edit.label) + '</a>' : '') + '</div></div>';
    }).join('') + '</div>' +
      '<p class="grey">People counts are live. Steps and email numbers were checked in Loops on ' + esc(niceDate(d.checked)) + '. Emails are edited in Loops.</p>';
  }

  /* ---------- wiring ---------- */

  function go(id, fromHash) {
    if (!PAGES.some(function (p) { return p.id === id; })) id = 'ads';
    page = id;
    if (!fromHash && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    render();
    load(current().part, false);
    window.scrollTo(0, 0);
  }

  ['nav', 'tabs'].forEach(function (id) {
    PAGES.forEach(function (p) {
      $(id).appendChild(el('button', { type: 'button', 'data-page': p.id, text: p.name, onclick: function () { go(p.id); } }));
    });
  });
  PERIODS.forEach(function (p) {
    $('switch').appendChild(el('button', { type: 'button', 'data-period': p[0], text: p[1], onclick: function () {
      period = p[0]; write('larkin-dash-period', period); render();
    } }));
  });
  $('refresh').addEventListener('click', function () { load(current().part, true); });
  var lastW = 0;
  window.addEventListener('resize', function () {
    var host = $('chart');
    if (host && drawChart && host.clientWidth !== lastW) { lastW = host.clientWidth; drawChart(); }
  });
  window.addEventListener('hashchange', function () { go(location.hash.slice(1), true); });
  $('lock-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim();
    if (!code) return;
    write(KEY, code);
    $('lock-msg').textContent = 'Checking…';
    load(current().part, true);
  });
  // Coming back to the page (or the home-screen app) fetches fresh numbers.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load(current().part, false);
  });

  page = PAGES.some(function (p) { return p.id === location.hash.slice(1); }) ? location.hash.slice(1) : 'ads';
  if (read(KEY)) { $('shell').classList.remove('hide'); render(); load(current().part, true); }
  else showLock();
})();
</script>
</body>
</html>
