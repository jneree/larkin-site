# Keeps batch.json (the founder batch "703 of 1,000 reserved" number) in step with Stripe.
# Every 15 minutes, counts paid reservations and commits batch.json only when the number moved.
name: founder batch count
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: batch-count
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/batch-count.mjs
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_BATCH_KEY }}
      - name: commit if changed
        run: |
          git diff --quiet batch.json && exit 0
          git config user.name "larkin-batch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add batch.json
          git commit -m "Founder batch: $(node -p "require('./batch.json').reserved") reserved"
          git push
