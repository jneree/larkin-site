<!DOCTYPE html>
<html lang="en" data-theme="general">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Larkin</title>
<meta name="description" content="That page doesn't exist. Find the Larkin AI memory wristband on the home page.">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .nf {
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: start;
    gap: 22px;
    padding-block: 4rem;
  }
  .nf__code {
    font-family: var(--font-display);
    font-size: clamp(5rem, 18vw, 12rem);
    line-height: 0.85;
    color: var(--fg-faint);
  }
  .nf__body {
    font-size: clamp(1.0625rem, 1.46vw, 1.3125rem);
    line-height: 1.6;
    color: var(--fg-muted);
    max-width: 44ch;
  }
  .nf__links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 8px;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--fg-dim);
  }
  .nf__links a:hover { color: var(--fg); }
</style>
</head>
<body class="surface--dark">
<main class="nf">
  <div class="shell">
    <p class="nf__code" aria-hidden="true">404</p>
    <h1 class="section-title">This page slipped.</h1>
    <p class="nf__body">The page you asked for doesn't exist — which is exactly the sort of thing Larkin is meant to prevent.</p>
    <p style="margin-top:28px"><a class="btn btn--primary" href="/">Back to Larkin</a></p>
    <nav class="nf__links" aria-label="Other pages">
      <a href="/leaders/">For leaders</a>
      <a href="/adhd/">For ADHD</a>
      <a href="/parents/">For parents</a>
      <a href="/journal/">For journaling</a>
    </nav>
  </div>
</main>
</body>
</html>
